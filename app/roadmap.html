<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>duokovalingo · роадмап</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#121a2c;--panel2:#0e1526;--line:#22304a;--fg:#f3efe6;--dim:#98a3ba;--dim2:#6f7b95;--dim3:#4b5b78;
  --acc:#ff7a59;--good:#58d68d;--warn:#ffc14d;--crit:#ff6b6b;--gut:16px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--disp:'Unbounded','Golos Text',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Golos Text',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hdr{display:flex;align-items:center;gap:10px;height:60px;padding:0 var(--gut);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);box-sizing:content-box}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border:1px solid var(--line);border-radius:10px;color:var(--fg);font-weight:600;font-size:14px;background:var(--panel)}
.back:active,.btn:active,.tog:active{transform:scale(.97);opacity:.9}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:38px}
.seg button{border:0;background:transparent;color:var(--dim);font-weight:600;font-size:12px;padding:0 11px;font-family:var(--mono)}.seg button.on{background:var(--line);color:var(--fg)}
.page{max-width:880px;margin:0 auto;padding:22px var(--gut) calc(60px + env(safe-area-inset-bottom))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:600}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,7.4vw,40px);line-height:1.08;letter-spacing:-.02em;margin:8px 0 6px}
h1 .to{color:var(--acc)}
.lede{color:var(--dim);margin:0;max-width:60ch}
.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:36px 0 10px}
.sec .r{letter-spacing:0;text-transform:none;font-size:13px;color:var(--dim);font-weight:600;font-family:var(--mono);text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
/* hero stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;min-width:0}
.stat .v{font-family:var(--disp);font-weight:800;font-size:clamp(22px,6.4vw,30px);line-height:1;letter-spacing:-.02em}
.stat .v small{font-size:.5em;color:var(--dim2);font-weight:700;margin-left:2px}
.stat .l{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.3}
/* timeline */
.tl{position:relative;padding:26px 0 0}
.tl .months{position:relative;height:18px;font-family:var(--mono);font-size:11px;color:var(--dim2)}
.tl .months span{position:absolute;top:0;transform:translateX(-1px);white-space:nowrap;border-left:1px solid var(--line);padding-left:4px;height:100%}
.lane{position:relative;height:34px;margin-top:8px}
.lane .lab{position:absolute;left:0;top:-2px;font-size:11px;color:var(--dim2);font-family:var(--mono);letter-spacing:.04em}
.band{position:absolute;top:14px;height:18px;border-radius:5px;border:1px dashed var(--dim3);background:#161f33;overflow:hidden;z-index:1}
.band span{position:absolute;left:6px;top:0;line-height:18px;font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}
.band.job{border-color:rgba(255,122,89,.55);background:#261e2b}.band.job span{color:#ffb7a4}
.band.offer{border-style:solid;border-color:var(--acc);background:#3a2530}.band.offer span{color:var(--fg)}
.track{position:relative;margin-top:14px}
.track::before{content:"";position:absolute;left:0;right:0;top:21px;height:2px;background:var(--line);border-radius:2px}
.track .done{position:absolute;left:0;top:21px;height:2px;background:var(--acc);border-radius:2px}
.dot{position:absolute;top:12px;z-index:1;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2px solid var(--dim3);background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--dim);padding:0}
.dot.ok{background:var(--acc);border-color:var(--bg);color:#1a0a05;box-shadow:0 0 0 2px var(--acc)}
.dot.late{border-color:var(--warn);color:var(--warn)}
.today{position:absolute;top:20px;bottom:0;width:2px;margin-left:-1px;background:rgba(243,239,230,.55);z-index:0}
.today b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:1px 6px;border-radius:5px;white-space:nowrap}
.tlwrap{overflow-x:auto;overflow-y:hidden;padding:6px 2px 4px;margin:0 -2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tl{min-width:900px}
/* milestones */
.ms{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.ms li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ms .n{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--dim3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--dim)}
.ms li.ok .n{background:var(--acc);border-color:var(--acc);color:#1a0a05}
.ms li.late .n{border-color:var(--warn);color:var(--warn)}
.ms .t{flex:1;min-width:0}
.ms .t div{font-weight:700;line-height:1.3}
.ms .t small{display:block;color:var(--dim);font-size:13px;font-family:var(--mono);margin-top:2px}
.ms li.ok .t div{color:var(--fg)}.ms li:not(.ok) .t div{color:#d9d5cc}
.tog{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:13px;font-weight:700}
.tog.on{border-color:var(--acc);color:var(--acc)}
.tog[disabled]{opacity:.45;cursor:default}
/* next step */
.next{display:grid;gap:10px}
.nrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.nrow.hot{border-color:var(--acc);background:linear-gradient(100deg,rgba(255,122,89,.16),rgba(255,122,89,0) 75%),var(--panel)}
.nrow .k{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);width:78px;line-height:1.3}
.nrow.hot .k{color:var(--acc)}
.nrow .b{flex:1;min-width:0}.nrow .b div{font-weight:700;line-height:1.3}.nrow .b small{color:var(--dim);font-size:13.5px}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--acc);color:#1a0a05;font-weight:800;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
/* checkpoint */
.cp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.goal .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.goal .v{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.goal .v small{font-size:13px;color:var(--dim2);font-family:var(--mono);font-weight:600;margin-left:3px;letter-spacing:0}
.goal .l{color:var(--dim);font-size:13px;margin-top:6px;line-height:1.3}
.meter{position:relative;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);margin-top:12px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--acc)}
.meter.full i{background:var(--good)}
.step{display:flex;gap:6px;margin-top:10px}
.step button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:18px;font-weight:700;line-height:1}
.step button[disabled]{opacity:.4;cursor:default}
.live{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
/* readiness */
.ready .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ready .big{font-family:var(--disp);font-weight:800;font-size:clamp(34px,10vw,52px);letter-spacing:-.03em;line-height:1}
.ready .big small{font-size:.38em;color:var(--dim2);margin-left:4px;letter-spacing:0}
.gauge{position:relative;height:16px;margin:16px 0 26px;border-radius:4px;background:var(--panel2);display:flex;gap:2px;padding:0}
.gauge i{display:block;height:100%}
.gauge i:first-child{border-radius:4px 0 0 4px}.gauge i:last-child{border-radius:0 4px 4px 0}
.fin{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg);margin-left:-1px}
.fin b{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--fg);white-space:nowrap;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.st-g{background:var(--good)}.st-y{background:var(--warn);background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.28) 0 2px,transparent 2px 5px)}.st-r{background:var(--crit)}.st-nw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim3)}.st-nf{background:#1a2438;box-shadow:inset 0 0 0 1px var(--dim3)}
/* knowledge map */
.stage{margin-top:16px}
.stage:first-child{margin-top:0}
.stage h3{margin:0 0 2px;font-size:13px;font-family:var(--mono);font-weight:600;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.trk{display:grid;grid-template-columns:minmax(92px,120px) 1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--fg)}
.trk .nm{font-weight:700;font-size:15px}
.trk .num{font-family:var(--mono);font-size:13px;color:var(--dim);white-space:nowrap}
.trk .num b{color:var(--fg)}
.bar{display:flex;gap:2px;height:12px;min-width:0}
.bar i{display:block;height:100%;min-width:3px}
.bar i:first-child{border-top-left-radius:4px;border-bottom-left-radius:4px}.bar i:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px}
.cells{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 14px}
.cells[hidden]{display:none}
.cell{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 10px 0 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:13px;font-weight:600;max-width:100%}
.cell .sw{width:10px;height:10px}
.cell .id{font-family:var(--mono);color:var(--dim2);font-size:12px}
.cell .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.note{color:var(--dim2);font-size:13px;margin-top:12px}
.banner{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,193,77,.4);background:rgba(255,193,77,.08);color:#ffe3a8;font-size:14px}
.banner a{font-weight:700}
#tip{position:fixed;z-index:10;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:9px;background:#f3efe6;color:#0b1220;font-size:13px;font-weight:600;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transition:opacity 80ms}
#tip small{display:block;font-family:var(--mono);font-size:11px;color:#4b5b78;font-weight:600;margin-bottom:2px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.cp{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:420px){.nrow{flex-wrap:wrap}.nrow .k{width:auto}.nrow .btn{width:100%}.trk{grid-template-columns:82px 1fr auto;gap:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   msDone:"Done",msMark:"Mark",msAuto:"computed",late:n=>`${n} day${n>1?"s":""} late`,left:n=>`in ${n} day${n>1?"s":""}`,
   cp:"Checkpoint",cpR:d=>`by ${d}`,gApps:"applications",gInt:"interview reps",gCold:"tickets cold",gSess:"sessions in 14 days",liveTag:"from the trainer",
   map:"Knowledge map",mapR:"tap a track to see its tickets",readyH:"Readiness",readyD:"share of active tickets at cold. The plan's finish line is 80%; the rest you reason through out loud.",
   fin:"finish 80%",g:"cold",y:"shaky",r:"missed",n:"never opened",parked:n=>`${n} parked ticket${n>1?"s are":" is"} not counted.`,
   offline:"Progress didn't load: sign in to the trainer and the roadmap will pick it up.",login:"Sign in",cantSave:"No connection to the server: marks won't be saved right now."}};

let lang=(()=>{try{return localStorage.getItem("drill.lang")||"ru"}catch{return "ru"}})();
let DB=window.STATE||{items:[],history:[]}, live=false, needLogin=false, open=new Set();
const L=()=>UI[lang], $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pl(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14))?b:c}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY=iso(new Date());
const D=s=>new Date(s+"T12:00:00");
const daysBetween=(a,b)=>Math.round((D(b)-D(a))/864e5);
const pct=s=>Math.max(0,Math.min(100,(D(s)-D(RANGE[0]))/(D(RANGE[1])-D(RANGE[0]))*100));
const fmtD=s=>D(s).toLocaleDateString(lang==="ru"?"ru-RU":"en-GB",{day:"numeric",month:"short"});
const RM=()=>DB.roadmap||{marks:{},counts:{}};
const count=k=>(RM().counts||{})[k]||0;

async function load(){
  try{const r=await fetch("/api/state",{cache:"no-store"}); if(r.ok){DB=await r.json(); live=true} else if(r.status===401) needLogin=true;}catch{}
  // make sure every ticket's item exists (same rule as the trainer)
  const miss=[]; for(const t of window.TICKETS||[]){ if(t.sec==="parked") continue; for(const id of t.core||[]) if(!DB.items.some(i=>i.id===id)&&!miss.some(m=>m.id===id)) miss.push({id,s:t.sec,t:t.en.topic}); }
  if(miss.length&&live){try{const r=await fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({items:miss})}); if(r.ok) DB=await r.json()}catch{}}
  else for(const m of miss) DB.items.push({...m,st:"new"});
}
async function save(body){
  if(!live){alert(L().cantSave);return}
  try{const r=await fetch("/api/roadmap",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}); if(r.ok){DB=await r.json(); render()}}catch{alert(L().cantSave)}
}

// ---------- derived numbers ----------
function numbers(){
  const active=DB.items.filter(i=>i.st!=="parked"&&i.s!=="meta"&&i.s!=="bonus");
  const by=s=>active.filter(i=>i.st===s).length;
  const intervals={red:1,yellow:3,green:7}; const ivOf=i=>i.iv||intervals[i.st];
  const due=DB.items.filter(i=>i.last&&ivOf(i)&&daysBetween(i.last,TODAY)>=ivOf(i)).length;
  const sess=(DB.history||[]).filter(h=>daysBetween(h.d,TODAY)<=13&&h.ids&&h.ids.length).length;
  return {active,g:by("green"),y:by("yellow"),r:by("red"),n:by("new"),total:active.length,parked:DB.items.filter(i=>i.st==="parked").length,due,sess,apps:count("applications"),ints:count("interviews")};
}
function msState(m,N){
  if(m.fixed) return {ok:true,date:m.d};
  if(m.auto){const ok=N.apps>=5&&N.ints>=2&&N.g>=12; return {ok,date:ok?TODAY:null}}
  const d=(RM().marks||{})[m.k]; return {ok:!!d,date:d||null};
}

// ---------- render ----------
function render(){
  document.documentElement.lang=lang; $("#ru").className=lang==="ru"?"on":""; $("#en").className=lang==="en"?"on":"";
  const N=numbers(); const readiness=N.total?N.g/N.total:0;
  let h=`<div class="eyebrow">${L().eyebrow}</div><h1>${L().title(L().from,L().to)}</h1><p class="lede">${L().lede}</p>`;
  if(needLogin||!live&&!DB.items.length) h+=`<div class="banner">${L().offline} <a href="./">${L().login} →</a></div>`;
  h+=`<div class="stats">
    <div class="stat"><div class="v">${daysBetween(START,TODAY)}</div><div class="l">${L().day}</div></div>
    <div class="stat"><div class="v">${N.g}<small>/${N.total}</small></div><div class="l">${L().ready}</div></div>
    <div class="stat"><div class="v">${N.apps}</div><div class="l">${L().apps}</div></div></div>`;

  // next step: the external event first, then the review
  h+=`<div class="sec"><span>${L().next}</span><span class="r">${L().nextR}</span></div><div class="next">
    <div class="nrow hot"><div class="k">${L().ext}</div><div class="b"><div>${L().appT(N.apps)}</div><small>${L().appS(N.apps)}</small></div><button class="btn" id="sent" ${live?"":"disabled"}>${L().sent}</button></div>
    <div class="nrow"><div class="k">${L().drill}</div><div class="b"><div>${L().dueT(N.due)}</div><small>${L().dueS(N.due)}</small></div><a class="btn ghost" href="./">${L().open}</a></div></div>`;

  // timeline
  const lastDone=Math.max(...MS.map(m=>{const s=msState(m,N);return s.ok?pct(s.date||m.d):0}));
  h+=`<div class="sec"><span>${L().tl}</span><span class="r">${L().tlR}</span></div><div class="card"><div class="tlwrap"><div class="tl">`;
  let months=""; for(let d=D(RANGE[0]);d<D(RANGE[1]);d.setMonth(d.getMonth()+1)){const k=iso(d); const lbl=d.toLocaleDateString(lang==="ru"?"ru-RU":"en-GB",{month:"short"}).replace(".",""); months+=`<span style="left:${pct(k)}%">${d.getMonth()===0?lbl+" ’"+String(d.getFullYear()).slice(2):lbl}</span>`}
  h+=`<div class="months">${months}</div>`;
  for(const lane of [0,1]){ h+=`<div class="lane"><span class="lab">${lane?L().lane1:L().lane0}</span>`+BANDS.filter(b=>b.lane===lane).map(b=>`<div class="band ${b.cls||""}" style="left:${pct(b.from)}%;width:${pct(b.to)-pct(b.from)}%" data-tip="${esc(b.full?b.full[lang]:b[lang])}" data-sub="${fmtD(b.from)} – ${fmtD(b.to)}"><span>${esc(b[lang])}</span></div>`).join("")+`</div>`; }
  const trackAt=h.length; h+=`<div class="track"><div class="done" style="width:${lastDone}%"></div>`;
  const rows=[]; MS.forEach((m,i)=>{const s=msState(m,N); const late=!s.ok&&m.d<TODAY; const x=pct(s.ok&&s.date?s.date:m.d); let row=0; while(rows[row]!==undefined&&x-rows[row]<2.8) row++; rows[row]=x; h+=`<button class="dot${s.ok?" ok":late?" late":""}" style="left:${x}%;top:${12+row*24}px" data-tip="${esc(m[lang])}" data-sub="${fmtD(s.ok&&s.date?s.date:m.d)}${s.ok?" · ✓":late?" · "+L().late(daysBetween(m.d,TODAY)):""}" aria-label="${i+1}. ${esc(m[lang])}">${i+1}</button>`});
  h=h.slice(0,trackAt)+h.slice(trackAt).replace('<div class="track">',`<div class="track" style="height:${40+(rows.length-1)*24}px">`);
  h+=`</div><div class="today" style="left:${pct(TODAY)}%"><b>${L().today}</b></div></div></div>`;
  h+=`<ul class="ms">`+MS.map((m,i)=>{const s=msState(m,N); const late=!s.ok&&m.d<TODAY; const when=s.ok?(s.date&&s.date!==m.d&&!m.fixed?`${L().msDone.toLowerCase()} ${fmtD(s.date)}`:""):(late?L().late(daysBetween(m.d,TODAY)):L().left(daysBetween(TODAY,m.d)));
    const ctl=m.fixed?"":m.auto?`<span class="live">${L().msAuto}</span>`:`<button class="tog${s.ok?" on":""}" data-ms="${m.k}" ${live?"":"disabled"}>${s.ok?"✓ "+L().msDone:L().msMark}</button>`;
    return `<li class="${s.ok?"ok":late?"late":""}"><span class="n">${s.ok?"✓":i+1}</span><div class="t"><div>${esc(m[lang])}</div><small>${fmtD(m.d)}${when?" · "+when:""}</small></div>${ctl}</li>`}).join("")+`</ul></div>`;

  // checkpoint
  const goal=(v,t,l,key,liveVal)=>{const f=Math.min(1,v/t); return `<div class="goal"><div class="top"><div class="v">${v}<small>/ ${t}</small></div>${liveVal?`<span class="live">${L().liveTag}</span>`:""}</div><div class="l">${l}</div><div class="meter${f>=1?" full":""}" role="img" aria-label="${v} / ${t}"><i style="width:${f*100}%"></i></div>${key?`<div class="step"><button data-cnt="${key}" data-d="-1" ${live&&v>0?"":"disabled"} aria-label="−1">−</button><button data-cnt="${key}" data-d="1" ${live?"":"disabled"} aria-label="+1">+</button></div>`:""}</div>`};
  h+=`<div class="sec"><span>${L().cp} · ${fmtD(CHECKPOINT)}</span><span class="r">${CHECKPOINT>=TODAY?L().left(daysBetween(TODAY,CHECKPOINT)):L().late(daysBetween(CHECKPOINT,TODAY))}</span></div><div class="cp">
    ${goal(N.apps,5,L().gApps,"applications")}${goal(N.ints,2,L().gInt,"interviews")}${goal(N.g,12,L().gCold,null,true)}${goal(N.sess,4,L().gSess,null,true)}</div>`;

  // readiness + knowledge map
  const seg=(c)=>c.map(([k,v,cls])=>v?`<i class="${cls}" style="flex:${v}" data-tip="${v} · ${L()[k]}"></i>`:"").join("");
  h+=`<div class="sec"><span>${L().map}</span><span class="r">${L().mapR}</span></div><div class="card ready">
    <div class="row"><div><div class="eyebrow">${L().readyH}</div><div class="big">${Math.round(readiness*100)}<small>%</small></div></div><div class="legend"><span><i class="sw st-g"></i>${L().g} ${N.g}</span><span><i class="sw st-y"></i>${L().y} ${N.y}</span><span><i class="sw st-r"></i>${L().r} ${N.r}</span><span><i class="sw st-nf"></i>${L().n} ${N.n}</span></div></div>
    <div class="gauge" role="img" aria-label="${L().g} ${N.g}, ${L().y} ${N.y}, ${L().r} ${N.r}, ${L().n} ${N.n}">${seg([["g",N.g,"st-g"],["y",N.y,"st-y"],["r",N.r,"st-r"],["n",N.n,"st-nf"]])}<span class="fin" style="left:${FINISH*100}%"><b>${L().fin}</b></span></div>
    <p class="note" style="margin-top:0">${L().readyD}</p>`;
  for(const st of STAGES){
    h+=`<div class="stage"><h3><span>${st[lang]}</span></h3>`;
    for(const s of st.secs){ const its=N.active.filter(i=>i.s===s); if(!its.length) continue; const c=x=>its.filter(i=>i.st===x).length; const g=c("green");
      h+=`<button class="trk" data-trk="${s}" aria-expanded="${open.has(s)}"><span class="nm">${SEC[s]}</span><span class="bar" role="img" aria-label="${SEC[s]}: ${g}/${its.length} ${L().g}">${seg([["g",g,"st-g"],["y",c("yellow"),"st-y"],["r",c("red"),"st-r"],["n",c("new"),"st-nf"]])}</span><span class="num"><b>${g}</b>/${its.length}</span></button>`;
      h+=`<div class="cells" ${open.has(s)?"":"hidden"}>`+its.map(i=>{const t=(window.TICKETS||[]).find(t=>(t.core||[]).includes(i.id)); const title=t?t[lang].topic:i.t; const cls={green:"st-g",yellow:"st-y",red:"st-r"}[i.st]||"st-nw"; return `<a class="cell" href="./#item/${i.id}"><i class="sw ${cls}"></i><span class="id">${i.id}</span><span class="tt">${esc(title)}</span></a>`}).join("")+`</div>`;}
    h+=`</div>`;}
  if(N.parked) h+=`<p class="note">${L().parked(N.parked)}</p>`;
  h+=`</div>`;
  app.innerHTML=h; wire();
  const tw=$(".tlwrap"); if(tw&&tw.scrollWidth>tw.clientWidth){const x=pct(TODAY)/100*tw.scrollWidth; tw.scrollLeft=Math.max(0,x-tw.clientWidth*0.6)}
}

function wire(){
  const s=$("#sent"); if(s) s.onclick=()=>save({type:"count",key:"applications",val:count("applications")+1});
  document.querySelectorAll("[data-cnt]").forEach(b=>b.onclick=()=>save({type:"count",key:b.dataset.cnt,val:count(b.dataset.cnt)+Number(b.dataset.d)}));
  document.querySelectorAll("[data-ms]").forEach(b=>b.onclick=()=>{const on=!!(RM().marks||{})[b.dataset.ms]; save({type:"mark",key:b.dataset.ms,val:on?null:TODAY})});
  document.querySelectorAll("[data-trk]").forEach(b=>b.onclick=()=>{const k=b.dataset.trk; open.has(k)?open.delete(k):open.add(k); b.setAttribute("aria-expanded",open.has(k)); b.nextElementSibling.hidden=!open.has(k)});
}
// tooltip: hover on desktop, tap on touch
const tip=$("#tip");
function showTip(el,x,y){ tip.innerHTML=(el.dataset.sub?`<small>${el.dataset.sub}</small>`:"")+el.dataset.tip; const w=tip.offsetWidth,hh=tip.offsetHeight; tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px"; tip.style.top=Math.max(8,y-hh-14)+"px"; tip.style.opacity=1; }
document.addEventListener("pointerover",e=>{const el=e.target.closest("[data-tip]"); if(el&&e.pointerType==="mouse") showTip(el,e.clientX,e.clientY)});
document.addEventListener("pointermove",e=>{const el=e.target.closest("[data-tip]"); if(el&&e.pointerType==="mouse") showTip(el,e.clientX,e.clientY); else if(e.pointerType==="mouse") tip.style.opacity=0});
document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-tip]"); if(el&&e.pointerType!=="mouse"){const r=el.getBoundingClientRect(); showTip(el,r.left+r.width/2,r.top)} else if(e.pointerType!=="mouse") tip.style.opacity=0});
addEventListener("scroll",()=>{tip.style.opacity=0},{passive:true});

$("#ru").onclick=()=>{lang="ru";try{localStorage.setItem("drill.lang",lang)}catch{} render()};
$("#en").onclick=()=>{lang="en";try{localStorage.setItem("drill.lang",lang)}catch{} render()};
(()=>{try{const ref=document.referrer; if(ref){const u=new URL(ref); if(u.origin===location.origin&&!u.pathname.endsWith("roadmap.html")){ $("#back").href=ref; $("#back").onclick=e=>{e.preventDefault(); history.back();}; }}}catch{}})();
render(); load().then(render);
</script>
<script src="ptr.js" defer></script>
</body>
</html>

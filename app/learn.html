<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<title>Разбор с нуля</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121a2c; --panel2:#0e1526; --line:#22304a;
    --fg:#f3efe6; --dim:#98a3ba; --dim2:#6f7b95;
    --acc:#ff7a59; --blue:#7aa2ff; --ok:#5dd39e; --warn:#e8b86a; --bad:#ff6b6b;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{scroll-padding-top:70px}
  body{background:var(--bg);color:var(--fg);font-family:'Golos Text',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.65;padding:0 0 80px;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  a{color:var(--blue)}
  .wrap{max-width:740px;margin:0 auto;padding:0 16px}
  #prog{position:fixed;top:0;left:0;height:3px;background:var(--acc);width:0;z-index:50;transition:width 80ms linear}
  .top{position:sticky;top:0;z-index:40;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top)}
  .topin{max-width:740px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
  .topin a.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;background:var(--panel)}
  .topin .ttl{flex:1;min-width:0;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
  .seg button{border:0;background:transparent;color:var(--dim);font-family:var(--mono);font-size:12px;padding:9px 11px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#1a0a05;font-weight:600}

  h1.big{font-family:'Unbounded','Golos Text',sans-serif;font-size:24px;line-height:1.25;margin:26px 0 6px;color:var(--fg);font-weight:800}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-top:22px}
  .lead{color:var(--dim);font-size:15px;margin:0 0 18px}

  /* index */
  .sech{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:26px 0 8px}
  .tl{display:flex;flex-direction:column;gap:6px}
  .ti{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);text-decoration:none}
  .ti:active{transform:scale(.99)}
  .ti .nn{font-family:var(--mono);font-size:12px;color:var(--dim2);width:26px;flex:none}
  .ti .tt{flex:1;min-width:0}
  .ti .tt b{display:block;font-weight:600;font-size:15px;line-height:1.35}
  .ti .tt small{color:var(--dim2);font-size:12px}
  .ti .st{flex:none;font-size:11px;font-family:var(--mono);color:var(--dim2)}
  .ti.read .st{color:var(--ok)}
  .ti.none{opacity:.45;pointer-events:none}
  .sumbar{display:flex;gap:10px;align-items:center;margin:4px 0 0;font-size:13px;color:var(--dim)}
  .sumbar .track{flex:1;height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
  .sumbar .fill{height:100%;background:var(--ok)}

  /* lesson */
  .why{border-left:3px solid var(--acc);background:var(--panel);padding:12px 14px;border-radius:0 10px 10px 0;color:var(--fg);font-size:15px;margin:14px 0 18px}
  .why .lbl{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:4px;font-weight:600}
  details.toc{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:4px 14px;margin:0 0 8px}
  details.toc summary{cursor:pointer;padding:9px 0;color:var(--dim);font-size:13px;list-style:none}
  details.toc summary::-webkit-details-marker{display:none}
  details.toc ol{margin:0 0 10px;padding-left:20px}
  details.toc li{margin:4px 0;font-size:14px}
  details.toc a{color:var(--fg);text-decoration:none}
  section.ls{margin-top:34px}
  section.ls h2{font-family:'Unbounded','Golos Text',sans-serif;font-size:17px;line-height:1.35;margin:0 0 12px;font-weight:700;color:var(--fg)}
  section.ls h2 .sn{color:var(--acc);margin-right:8px}
  p{margin:0 0 14px}
  code{font-family:var(--mono);font-size:.86em;background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:#ffd9c9;word-break:break-word}
  pre{margin:0 0 16px;background:#070c17;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#dfe6f5;-webkit-overflow-scrolling:touch}
  pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit;word-break:normal}
  pre .lang{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-bottom:6px}
  ul.b,ol.b{margin:0 0 16px;padding-left:22px}
  ul.b li,ol.b li{margin:0 0 8px}
  ol.b li::marker{color:var(--acc);font-weight:700}
  .box{border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:15px}
  .box .lbl{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;font-weight:600}
  .box.ex{background:rgba(122,162,255,.08);border:1px solid rgba(122,162,255,.28)}
  .box.ex .lbl{color:var(--blue)}
  .box.fe{background:rgba(93,211,158,.07);border:1px solid rgba(93,211,158,.28)}
  .box.fe .lbl{color:var(--ok)}
  .box.warn{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.3)}
  .box.warn .lbl{color:var(--bad)}
  .tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
  th{background:var(--panel);color:var(--dim);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:0}

  dl.terms{margin:0}
  dl.terms dt{font-weight:700;margin-top:12px;color:var(--fg)}
  dl.terms dd{margin:2px 0 0;color:var(--dim)}
  .dec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--panel2)}
  .dec q{display:block;font-style:italic;color:var(--fg);quotes:"«" "»";margin-bottom:5px}
  .dec div{color:var(--dim);font-size:14.5px}
  details.chk{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--panel)}
  details.chk summary{cursor:pointer;padding:11px 14px;list-style:none;display:flex;gap:10px}
  details.chk summary::-webkit-details-marker{display:none}
  details.chk summary .qn{font-family:var(--mono);color:var(--acc);flex:none}
  details.chk .a{padding:0 14px 12px 40px;color:var(--dim);font-size:15px}
  details.chk[open] summary{color:var(--fg)}
  .hintline{font-size:13px;color:var(--dim2);margin:-4px 0 12px}
  ol.srcs{padding-left:20px;margin:0;font-size:13px;color:var(--dim)}
  ol.srcs li{margin:0 0 10px}
  ol.srcs a{font-family:var(--mono);font-size:11.5px;word-break:break-all}
  .end{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px}
  .end a,.end button{flex:1 1 200px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px 'Golos Text',sans-serif;text-decoration:none;cursor:pointer}
  .end .pri{background:var(--acc);border-color:var(--acc);color:#1a0a05}
  .end .done{border-color:var(--ok);color:var(--ok)}
  .nav2{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px}
  .nav2 a{color:var(--dim);text-decoration:none;max-width:48%}
  .empty{color:var(--dim);text-align:center;padding:60px 10px}
  @media(max-width:430px){h1.big{font-size:21px}body{font-size:15.5px}}
</style>
</head>
<body>
<div id="prog"></div>
<div class="top"><div class="topin">
  <a class="btn" id="back" href="./"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span id="backt"></span></a>
  <span class="ttl" id="ttl"></span>
  <div class="seg"><button id="lru">RU</button><button id="len">EN</button></div>
</div></div>
<main class="wrap" id="main"></main>

<script src="tickets.js"></script>
<script>
const UI={
 ru:{home:"Главная",all:"Все разборы",h1:"Разбор с нуля",lead:"Каждая тема от базы: термины, механика, пример, ловушки, самопроверка. Сначала читаешь разбор, потом отвечаешь по билету.",
     read:"прочитано",new:"не прочитано",soon:"скоро",why:"Зачем это спрашивают",toc:"Содержание",terms:"Термины",decode:"Расшифровка эталона",
     decodeh:"Фразы из эталонного ответа, которые без контекста непонятны, и что они значат.",check:"Самопроверка",checkh:"Сначала ответь сам, потом открывай.",
     src:"Источники",srch:"Каждый факт сверён с первоисточником.",ex:"Пример",fe:"Как во фронтенде",warn:"Ловушка",drill:"Отвечать по билету",mark:"Отметить прочитанным",
     marked:"Прочитано ✓",prev:"←",next:"→",ticket:"Билет",words:"мин чтения",err:"Не удалось загрузить разбор. Проверь сеть и обнови страницу.",
     sec:{llm:"LLM engineering",rag:"RAG",agents:"Агенты",sysd:"Системный дизайн",behav:"Behavioral",js:"JavaScript",ts:"TypeScript",react:"React",web:"Браузер и веб-платформа",bonus:"Глубина",parked:"Быстрая проверка JS/React"}},
 en:{home:"Home",all:"All lessons",h1:"From zero",lead:"Every topic from the ground up: terms, mechanism, example, traps, self-check. Read the lesson first, then answer the ticket.",
     read:"read",new:"unread",soon:"soon",why:"Why they ask",toc:"Contents",terms:"Terms",decode:"Decoding the reference answer",
     decodeh:"Phrases from the reference answer that don't make sense without context, and what they mean.",check:"Self-check",checkh:"Answer it yourself first, then open.",
     src:"Sources",srch:"Every fact checked against a primary source.",ex:"Example",fe:"Frontend parallel",warn:"Trap",drill:"Answer the ticket",mark:"Mark as read",
     marked:"Read ✓",prev:"←",next:"→",ticket:"Ticket",words:"min read",err:"Couldn't load the lesson. Check your connection and reload.",
     sec:{llm:"LLM engineering",rag:"RAG",agents:"Agents",sysd:"System design",behav:"Behavioral",js:"JavaScript",ts:"TypeScript",react:"React",web:"Browser and web platform",bonus:"Depth",parked:"Quick JS/React check"}}
};
const ORDER=["llm","rag","agents","sysd","behav","js","ts","react","web","bonus","parked"];
const T=window.TICKETS, $=id=>document.getElementById(id), main=$("main");
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let lang=(()=>{try{return localStorage.getItem("drill.lang")||"ru"}catch{return "ru"}})();
const L=()=>UI[lang];
let IDX=null; const cache={};
const readSet=()=>new Set(store.get("learn.read",[]));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Lesson text is our own reviewed content; allow only <b>, <i>, <code> inline tags, escape everything else.
const rich=s=>esc(s).replace(/&lt;(\/?)(b|i|code)&gt;/g,"<$1$2>");
const short=u=>{try{const x=new URL(u);return (x.host.replace(/^www\./,"")+x.pathname+x.hash).replace(/\/$/,"")}catch{return u}};

async function index(){ if(IDX) return IDX; try{IDX=await (await fetch("lessons/index.json",{cache:"no-cache"})).json()}catch{IDX={}} return IDX; }
async function lesson(n){ if(cache[n]) return cache[n]; const r=await fetch(`lessons/L${n}.json`,{cache:"no-cache"}); if(!r.ok) throw new Error(r.status); return cache[n]=await r.json(); }

function chrome(title){
  $("lru").className=lang==="ru"?"on":""; $("len").className=lang==="en"?"on":"";
  document.documentElement.lang=lang; $("ttl").textContent=title||"";
}
function setBack(toIndex){
  const b=$("back");
  if(toIndex){ b.href="#"; $("backt").textContent=L().all; b.onclick=e=>{e.preventDefault(); location.hash="";}; }
  else { b.href="./"; $("backt").textContent=L().home; b.onclick=null; }
}

async function renderIndex(){
  chrome(""); setBack(false); document.title=L().h1;
  const idx=await index(), rd=readSet();
  const have=T.filter(t=>idx[t.n]), done=have.filter(t=>rd.has(t.n)).length;
  let h=`<div class="kick">${have.length} / ${T.length}</div><h1 class="big">${L().h1}</h1><p class="lead">${L().lead}</p>
    <div class="sumbar"><div class="track"><div class="fill" style="width:${have.length?Math.round(done/have.length*100):0}%"></div></div><span>${done}/${have.length} ${L().read}</span></div>`;
  for(const sec of ORDER){
    const ts=T.filter(t=>t.sec===sec); if(!ts.length) continue;
    h+=`<div class="sech"><span>${L().sec[sec]||sec}</span><span>${ts.filter(t=>rd.has(t.n)).length}/${ts.length}</span></div><div class="tl">`;
    for(const t of ts){
      const m=idx[t.n], r=rd.has(t.n);
      h+=`<a class="ti${m?"":" none"}${r?" read":""}" href="#t${t.n}"><span class="nn">${t.n}</span><span class="tt"><b>${esc(m?m[lang]?.title||t[lang].topic:t[lang].topic)}</b>${m?`<small>${Math.max(1,Math.round((m[lang]?.words||0)/170))} ${L().words}</small>`:""}</span><span class="st">${m?(r?"✓ "+L().read:L().new):L().soon}</span></a>`;
    }
    h+=`</div>`;
  }
  main.innerHTML=h; window.scrollTo(0,0); prog();
}

function block(b){
  if(typeof b==="string") return `<p>${rich(b)}</p>`;
  if(b.code!=null) return `<pre>${b.lang?`<span class="lang">${esc(b.lang)}</span>`:""}<code>${esc(b.code)}</code></pre>`;
  if(b.list) return `<ul class="b">${b.list.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`;
  if(b.ol) return `<ol class="b">${b.ol.map(x=>`<li>${rich(x)}</li>`).join("")}</ol>`;
  for(const k of ["ex","fe","warn"]) if(b[k]!=null) return `<div class="box ${k}"><span class="lbl">${L()[k]}</span>${rich(b[k])}</div>`;
  if(b.table) return `<div class="tw"><table><thead><tr>${b.table.head.map(x=>`<th>${rich(x)}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(x=>`<td>${rich(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return "";
}

async function renderLesson(n){
  const t=T.find(x=>x.n===n); if(!t){location.hash="";return}
  setBack(true); chrome(`${L().ticket} ${n} · ${t[lang].topic}`);
  let Ld; try{Ld=await lesson(n)}catch{main.innerHTML=`<div class="empty">${L().err}</div>`;return}
  const x=Ld[lang]||Ld.ru; document.title=x.title;
  const extra=[["terms",L().terms],...(x.decode?.length?[["decode",L().decode]]:[]),["check",L().check],["src",L().src]];
  const rd=readSet(), idx=await index();
  const have=T.filter(k=>idx[k.n]); const pos=have.findIndex(k=>k.n===n); const prev=have[pos-1], next=have[pos+1];
  main.innerHTML=`
    <div class="kick">${L().ticket} ${n} · ${esc(t[lang].topic)}</div>
    <h1 class="big">${esc(x.title)}</h1>
    <div class="why"><span class="lbl">${L().why}</span>${rich(x.why)}</div>
    <details class="toc"><summary>${L().toc} ▾</summary><ol>${x.sections.map((s,i)=>`<li><a href="#s${i}" data-j="s${i}">${esc(s.h)}</a></li>`).join("")}${extra.map(([id,h])=>`<li><a href="#${id}" data-j="${id}">${h}</a></li>`).join("")}</ol></details>
    ${x.sections.map((s,i)=>`<section class="ls" id="s${i}"><h2><span class="sn">${i+1}</span>${esc(s.h)}</h2>${s.body.map(block).join("")}</section>`).join("")}
    <section class="ls" id="terms"><h2>${L().terms}</h2><dl class="terms">${x.terms.map(d=>`<dt>${rich(d.t)}</dt><dd>${rich(d.d)}</dd>`).join("")}</dl></section>
    ${x.decode?.length?`<section class="ls" id="decode"><h2>${L().decode}</h2><p class="hintline">${L().decodeh}</p>${x.decode.map(d=>`<div class="dec"><q>${esc(d.s)}</q><div>${rich(d.m)}</div></div>`).join("")}</section>`:""}
    <section class="ls" id="check"><h2>${L().check}</h2><p class="hintline">${L().checkh}</p>${x.check.map((c,i)=>`<details class="chk"><summary><span class="qn">${i+1}</span><span>${rich(c.q)}</span></summary><div class="a">${rich(c.a)}</div></details>`).join("")}</section>
    <section class="ls" id="src"><h2>${L().src}</h2><p class="hintline">${L().srch}</p><ol class="srcs">${(Ld.sources||[]).map(s=>`<li>${esc(s.claim)}${s.quote?` — <i>${esc(s.quote)}</i>`:""}<br><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(short(s.url))}</a></li>`).join("")}</ol></section>
    <div class="end"><button id="mk" class="${rd.has(n)?"done":""}">${rd.has(n)?L().marked:L().mark}</button><a class="pri" href="exam-tickets.html#t${n}">${L().drill} →</a></div>
    <div class="nav2">${prev?`<a href="#t${prev.n}">${L().prev} ${prev.n}. ${esc(idx[prev.n][lang]?.title||prev[lang].topic)}</a>`:"<span></span>"}${next?`<a href="#t${next.n}" style="text-align:right">${next.n}. ${esc(idx[next.n][lang]?.title||next[lang].topic)} ${L().next}</a>`:""}</div>`;
  // in-page anchors: scroll without touching the router hash
  main.querySelectorAll("a[data-j]").forEach(a=>a.onclick=e=>{e.preventDefault(); document.getElementById(a.dataset.j)?.scrollIntoView({behavior:"smooth"});});
  $("mk").onclick=()=>{const s=readSet(); s.has(n)?s.delete(n):s.add(n); store.set("learn.read",[...s]); const on=s.has(n); $("mk").className=on?"done":""; $("mk").textContent=on?L().marked:L().mark;};
  if(!keepScroll) window.scrollTo(0,0); keepScroll=false; prog();
}

let keepScroll=false;
function route(){ const m=location.hash.match(/^#t(\d+)$/); m?renderLesson(+m[1]):renderIndex(); }
function prog(){ const h=document.documentElement; const max=h.scrollHeight-h.clientHeight; $("prog").style.width=(max>0&&/^#t\d+$/.test(location.hash)?Math.min(100,h.scrollTop/max*100):0)+"%"; }
addEventListener("scroll",prog,{passive:true});
addEventListener("hashchange",route);
for(const [id,l] of [["lru","ru"],["len","en"]]) $(id).onclick=()=>{ if(lang===l) return; const y=scrollY/Math.max(1,document.documentElement.scrollHeight); lang=l; try{localStorage.setItem("drill.lang",l)}catch{}; keepScroll=/^#t\d+$/.test(location.hash); route(); if(keepScroll) setTimeout(()=>scrollTo(0,y*document.documentElement.scrollHeight),0); };
route();
</script>
<script src="ptr.js" defer></script>
</body>
</html>

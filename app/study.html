<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Разборы с нуля — duokovalingo</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121a2c;--line:#34435d;--fg:#f3efe6;--dim:#b0b9ca;--acc:#ff987e}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:20px}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 system-ui,-apple-system,sans-serif}main{max-width:820px;margin:auto;padding:24px 22px 80px}a{color:var(--acc);text-underline-offset:4px;overflow-wrap:anywhere}a:hover{text-decoration-thickness:2px}a:focus-visible,select:focus-visible,summary:focus-visible,pre:focus-visible{outline:3px solid var(--acc);outline-offset:4px}nav{display:flex;flex-wrap:wrap;gap:12px 24px;margin-bottom:24px;font-size:15px}h1{font-size:clamp(25px,5vw,36px);line-height:1.25;margin:8px 0 16px}h2{font-size:24px;line-height:1.35;margin:40px 0 16px}p{margin:0 0 20px}label{display:block;font-size:14px;color:var(--dim);margin-bottom:6px}select{max-width:100%;width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:15px;min-height:48px}.eyebrow,.meta{color:var(--dim);font-size:14px}.eyebrow{margin-top:28px}.intro{border-left:3px solid var(--acc);padding:12px 18px;background:var(--panel);font-size:15px}.contents{margin:24px 0;padding:16px 22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.contents ol{margin:8px 0 0;padding-left:24px}.contents a{font-size:15px}pre{max-width:100%;overflow:auto;background:#070d18;border:1px solid var(--line);border-radius:10px;padding:18px;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}details.answer{margin:28px 0;border:1px solid var(--line);border-radius:12px;padding:16px 20px;background:var(--panel)}summary{cursor:pointer;font-weight:600}details.answer[open] summary{margin-bottom:18px}.bottom{border-top:1px solid var(--line);padding-top:22px;margin-top:36px}.bottom nav{justify-content:space-between}.catalog{margin:24px 0;padding-left:28px}.catalog li{margin-bottom:10px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{body{background:white;color:black;font-size:12pt}nav,.picker,.contents,.intro{display:none}main{max-width:none;padding:0}a{color:inherit}pre,details.answer{background:white;border-color:#aaa;white-space:pre-wrap}h2{break-after:avoid}pre{break-inside:avoid}}
</style>
</head>
<body>
<main>
  <nav aria-label="Основная навигация"><a href="./">duokovalingo</a><a href="exam-tickets.html" id="ticket">Билеты</a><a href="study.html">Все разборы</a></nav>
  <div class="picker"><label for="lesson-select">Выбрать тему</label><select id="lesson-select"><option value="">Все 50 тем</option></select></div>
  <article id="lesson"></article>
  <noscript>Для навигации нужен JavaScript. Все разборы доступны также в <a href="lessons-content.md">текстовом файле</a>.</noscript>
</main>
<script src="tickets.js"></script>
<script src="lessons.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lessons = window.LESSONS;
const selector = $('lesson-select');
for (const t of window.TICKETS) {
  const o = document.createElement('option'); o.value = t.n; o.textContent = `${t.n}. ${lessons[t.n].title}`; selector.append(o);
}
selector.addEventListener('change', () => { location.hash = selector.value ? 't' + selector.value : ''; });
function render(scroll = false) {
  const match = /^#t(\d+)(?:-s\d+)?$/.exec(location.hash);
  const n = match ? Number(match[1]) : null;
  const lesson = lessons[n];
  selector.value = lesson ? String(n) : '';
  $('ticket').href = lesson ? `exam-tickets.html#t${n}` : 'exam-tickets.html';
  $('ticket').textContent = lesson ? `Билет ${n}: проверить себя` : 'Билеты';
  if (!lesson) {
    document.title = 'Разборы с нуля — duokovalingo';
    $('lesson').innerHTML = `<h1 tabindex="-1">Разборы с нуля</h1><p>50 тем: объяснение, механизм, пример, ошибки и самостоятельная практика. Начни с незнакомой темы, затем вернись к билету и ответь своими словами.</p><p class="meta">Учебные разборы — на русском. Краткие ответы для собеседования в билетах доступны на русском и английском. Условные расчёты и учебные примеры обозначены в тексте; ссылки ведут к документации по соответствующему механизму.</p><ol class="catalog">${window.TICKETS.map(t=>`<li><a href="#t${t.n}">${esc(lessons[t.n].title)}</a></li>`).join('')}</ol>`;
  } else {
    document.title = `${n}. ${lesson.title} — Разбор с нуля`;
    const sections = lesson.sections.slice(0,-1), answer = lesson.sections.at(-1);
    $('lesson').innerHTML = `<div class="eyebrow">Билет ${n} · Разбор с нуля</div><h1 tabindex="-1">${esc(lesson.title)}</h1><p class="meta">${lesson.words} слов · чтение, затем практика в своём темпе</p><p class="intro">Сначала разберись в объяснении, затем попробуй упражнение без подсказки. Ответ для проверки — в конце. После этого <a href="exam-tickets.html#t${n}">вернись к вопросам билета</a>.</p><nav class="contents" aria-label="Оглавление разбора"><ol>${sections.map((s,i)=>`<li><a href="#t${n}-s${i}">${esc(s.heading)}</a></li>`).join('')}</ol></nav>${sections.map((s,i)=>`<section aria-labelledby="t${n}-s${i}"><h2 id="t${n}-s${i}">${esc(s.heading)}</h2>${s.html}</section>`).join('')}<details class="answer"><summary>Показать ответ к упражнению</summary>${answer.html}</details><div class="bottom"><p><a href="exam-tickets.html#t${n}">Ответить на вопросы билета ${n} →</a></p><nav aria-label="Соседние разборы">${n>1?`<a href="#t${n-1}">← Разбор ${n-1}</a>`:'<span></span>'}${n<50?`<a href="#t${n+1}">Разбор ${n+1} →</a>`:''}</nav></div>`;
  }
  if (scroll) { window.scrollTo(0,0); $('lesson').querySelector('h1').focus({preventScroll:true}); }
}
let active = null;
function route(initial = false) {
  const key = /^#t(\d+)/.exec(location.hash)?.[1] || '';
  if (active !== key) { active = key; render(!initial); }
  const section = /^#t\d+-s\d+$/.test(location.hash) && document.getElementById(location.hash.slice(1));
  if (section) section.scrollIntoView();
}
window.addEventListener('hashchange',()=>route());
route(true);
</script>
</body>
</html>

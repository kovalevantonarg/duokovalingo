<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="duokovalingo">
<title>duokovalingo — core-40</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== tokens (from the Claude Design canvas, "paper on navy") ===== */
:root{--bg:#0b1220;--panel:#121a2c;--panel2:#0e1526;--line:#22304a;--codebg:#1b2740;--fg:#f3efe6;--dim:#98a3ba;--dim2:#6f7b95;--dim3:#4b5b78;
  --blue:#ff7a59;--good:#58d68d;--good-t:#062b14;--warn:#ffc14d;--warn-t:#2e1e00;--crit:#ff6b6b;--crit-t:#3a0808;
  --fire:#ffc14d;--l1:#8a4a38;--l2:#ff7a59;--l3:#ffb39e;
  --std:200ms cubic-bezier(.2,0,0,1);--spring:350ms cubic-bezier(.34,1.56,.64,1);--gut:20px}
@media(min-width:700px){:root{--gut:32px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Golos Text',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}
a{color:var(--blue);text-decoration:none}a:hover{color:#ffa088}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
code{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;font-size:.86em;background:var(--codebg);padding:2px 7px;border-radius:7px;color:var(--fg);white-space:nowrap}
svg{flex:none}
.sp{flex:1}
/* header */
.hdr{display:flex;align-items:center;gap:10px;height:60px;padding:0 var(--gut);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);box-sizing:content-box}
.wm{font-family:'Unbounded','Golos Text',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--fg);display:inline-flex;align-items:baseline;gap:7px}.wm:hover{color:var(--fg)}.wmfull{display:none}@media(min-width:700px){.wmfull{display:inline}.wmshort{display:none}}
.wm small{white-space:nowrap;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:var(--dim2);letter-spacing:.08em;text-transform:uppercase}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:15px;font-family:'Unbounded','Golos Text',sans-serif}.stat.fire{color:var(--fire)}.stat.xp{color:var(--dim)}
.icb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icb.off{opacity:.45}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:38px}
.seg button{border:0;background:transparent;color:var(--dim);font-weight:600;font-size:12px;padding:0 11px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}.seg button.on{background:var(--line);color:var(--fg)}
/* page */
.page{max-width:964px;margin:0 auto;padding:24px var(--gut) 48px;display:flex;flex-direction:column}
.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;margin-top:32px}.sec:first-child{margin-top:0}
.rmlink{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:22px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(100deg,rgba(255,122,89,.14),rgba(255,122,89,0) 70%),var(--panel);color:var(--fg)}.rmlink:hover{color:var(--fg);border-color:var(--blue)}.rmlink .rmt{font-family:'Unbounded','Golos Text',sans-serif;font-weight:800;font-size:15px}.rmlink .rms{flex:1;color:var(--dim);font-size:13.5px;min-width:0}.rmlink svg{color:var(--blue);flex:none}
.sec .r{letter-spacing:0;text-transform:none;font-size:13px;color:var(--dim);font-weight:600;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:10px}
.item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.sw{width:12px;height:12px;border-radius:4px;margin-top:6px;flex:none;position:relative;box-sizing:border-box}
.sw.green{background:var(--good)}.sw.yellow{background:var(--warn)}.sw.red{background:var(--crit)}.sw.new{border:1.5px dashed var(--dim2)}.sw.parked{background:repeating-linear-gradient(135deg,#2c3b57 0 2px,transparent 2px 4px)}.sw.ship{background:var(--blue)}
.sw.due::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--panel)}
.it{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .t{font-size:16px;font-weight:700;line-height:1.3}.it .t .id{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--dim2);margin-right:6px;font-size:13px}
.it .s{font-size:13.5px;color:var(--dim);font-weight:500}.it .s .ov{color:var(--warn);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:600;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:13px;font-weight:700;transition:transform 120ms,opacity 120ms,color 120ms,border-color 120ms}
.chip:hover{color:var(--fg)}.chip:active{transform:scale(.97);opacity:.9;transition-duration:60ms}
.chip.hot{border-color:var(--blue);color:var(--blue)}
@media(min-width:700px){.item{align-items:center;padding:12px 16px}.it .chips{display:none}.item>.chips{margin-top:0}.chip{height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}}
@media(max-width:699px){.item>.chips{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:14px;border:0;font-weight:700;font-size:16px;color:var(--fg);flex:none;transition:transform 120ms,opacity 120ms}
.btn:active,.btn.press{transform:scale(.97);opacity:.9;transition-duration:60ms}
.btn.blue{background:var(--blue);color:#1a0a05}
.btn.green{background:var(--good);color:var(--good-t)}
.btn.red{background:var(--crit);color:var(--crit-t)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.grey{background:var(--codebg);color:var(--dim2)}
.btn.ghost{background:transparent;color:var(--dim);padding:0 8px}.btn.ghost:hover{color:var(--fg)}
.btn.full{width:100%}.btn.big{height:56px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default;transform:none!important}
.kbd{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:var(--dim2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;line-height:1.5;white-space:nowrap}
.hint{font-size:13px;color:var(--dim2);font-weight:600;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
@media(max-width:699px){.hint,.kbd.dk{display:none}}
.quick{margin-top:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quick .qt{font-size:18px;font-weight:800}.quick .qt span{color:var(--dim2);font-weight:600;font-size:13.5px;margin-left:6px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.sub{font-size:13.5px;color:var(--dim);line-height:1.45;font-weight:500;margin:0}
@media(min-width:700px){.quick{flex-direction:row;align-items:center;gap:20px;padding:16px 16px 16px 20px}.quick .qi{flex:1}.quick .btn{width:180px}}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--warn);background:var(--panel);color:var(--warn);font-size:13px;line-height:1.4;font-weight:600;margin-top:16px}.banner code{background:var(--line);color:var(--fg);white-space:normal}
/* wall */
.wall{display:flex;flex-wrap:wrap;gap:16px 22px;padding:16px}
.wsec{display:flex;flex-direction:column;gap:7px}
.wlab{font-size:11px;color:var(--dim2);letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;gap:12px}.wlab .c{letter-spacing:0;text-transform:none;color:var(--dim);font-weight:600;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{width:40px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:600;font-size:13px;position:relative;border:1px solid var(--line);background:var(--panel2);color:var(--dim);box-sizing:border-box;padding:0;transition:background var(--spring),border-color var(--spring),transform 120ms,opacity 120ms}
.cell:active{transform:scale(.97);opacity:.9}
.cell.green{background:var(--good);border-color:var(--good);color:var(--good-t)}
.cell.yellow{background:var(--warn);border-color:var(--warn);color:var(--warn-t)}
.cell.red{background:var(--crit);border-color:var(--crit);color:var(--crit-t)}
.cell.new{border-style:dashed;border-color:var(--dim2);background:transparent;color:var(--dim2)}
.cell.parked{background:repeating-linear-gradient(135deg,var(--panel2) 0 3px,var(--line) 3px 5px);color:var(--dim2);opacity:.7;cursor:default}
.cell.due::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--bg);box-sizing:border-box}
.cell.pop{animation:pop var(--spring)}
@media(min-width:700px){.cell{width:36px;height:32px;font-size:12px;border-radius:9px}}
.actv{padding:16px;display:flex;flex-direction:column;gap:18px}
.astats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.astats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ast{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.ast .v{font-family:'Unbounded','Golos Text',sans-serif;font-weight:800;font-size:22px;line-height:1;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.ast .v.fire{color:var(--fire)}.ast .v small{font-size:13px;color:var(--dim2);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:600;letter-spacing:0}
.ast .l{color:var(--dim);font-size:13px;margin-top:7px;line-height:1.3}.ast .l span{display:block;color:var(--dim2);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11.5px;margin-top:2px}
.ast .mini{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}.ast .mini i{display:block;height:100%;background:var(--blue);border-radius:2px}
.hgrid{display:grid;grid-template-columns:26px minmax(0,calc(var(--w)*30px));column-gap:8px;row-gap:6px}
.hmonths,.hcells,.hbars{display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));column-gap:3px}
.hmonths span{font-size:11px;font-weight:700;color:var(--dim2);white-space:nowrap;overflow:visible}
.hcells{grid-template-rows:repeat(7,auto);grid-auto-flow:column;row-gap:3px}
.hdows{display:grid;grid-template-rows:repeat(7,1fr);row-gap:3px;font-size:10px;font-weight:700;color:var(--dim2);align-items:center}
.dy{display:block;aspect-ratio:1;border-radius:3px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--std)}
.dy.l1{background:#4a2a2c;box-shadow:none}.dy.l2{background:#8a4332;box-shadow:none}.dy.l3{background:#d05f42;box-shadow:none}.dy.l4{background:#ff9a7c;box-shadow:none}
.dy.today{box-shadow:0 0 0 1.5px var(--fg)}.dy.fut{visibility:hidden}
.hcells .dy{cursor:default}
.hrl{font-size:10px;font-weight:700;color:var(--dim2);align-self:end;line-height:1}
.hbars{position:relative;height:36px;align-items:end;margin-top:4px}
.wbar{display:block;height:max(2px,calc(var(--h)*100%));background:var(--dim3);border-radius:2px 2px 0 0}
.wbar.met{background:var(--blue)}.wbar.cur{outline:1px solid var(--fg);outline-offset:1px}
.tline{position:absolute;left:0;right:0;bottom:calc(var(--t)*100%);border-top:1px dashed var(--dim2);pointer-events:none;z-index:1}
.hleg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--dim2);font-weight:600;flex-wrap:wrap}
.hleg .dy{width:11px;height:11px}.hleg span:first-child{margin-right:4px}.hleg span:nth-child(7){margin-left:4px}.hleg .sp{flex:1}
.tl-key{display:inline-flex;align-items:center;gap:6px}.tl-key i{width:16px;border-top:1px dashed var(--dim2)}
#tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:9px;background:#f3efe6;color:#0b1220;font-size:13px;font-weight:600;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;transition:opacity 80ms}
#tip.on{opacity:1}#tip small{display:block;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;color:#4b5b78;margin-bottom:2px}
/* rounds */
.round{max-width:640px;margin:0 auto;padding:20px var(--gut) 0;display:flex;flex-direction:column;min-height:100dvh}
@media(min-width:700px){.round{padding-top:32px}}
.rtop{display:flex;align-items:center;gap:14px}
.x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--dim2);background:transparent;border:0;padding:0;margin-left:-6px}.x:hover{color:var(--fg)}
.pbar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width var(--std),background var(--std)}
.pbar.ok i{background:var(--good)}
.combo{font-family:'Unbounded','Golos Text',sans-serif;font-weight:700;color:var(--warn);font-size:14px;display:inline-flex;align-items:center;gap:4px;min-width:40px;justify-content:flex-end}
.combo.pop{animation:pop var(--spring)}
.tag{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:600}
.stmt{font-size:24px;line-height:1.3;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:pretty}
.qn{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:600}
.q{font-size:24px;line-height:1.3;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:pretty}
@media(min-width:700px){.stmt{font-size:30px}.q{font-size:28px}}
.body{display:flex;flex-direction:column;gap:16px;margin-top:28px}
@media(min-width:700px){.body{margin-top:48px}}
#sheetSlot{margin-top:auto}#sheetSlot:empty{display:none}.act:not([style*="none"])+#sheetSlot{margin-top:0}
.act{margin-top:auto;padding:24px 0 calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.pair{display:flex;gap:12px}
.ans{position:relative;flex:1;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0;transition:transform 120ms,opacity 120ms,background var(--spring),border-color var(--spring),color var(--spring)}
.ans:active{transform:scale(.97);opacity:.9;transition-duration:60ms}
.ans.pick{border-color:var(--good);background:var(--good);color:var(--good-t);animation:pop var(--spring)}
.ans.pick.bad{border-color:var(--crit);background:var(--crit);color:var(--crit-t);animation:shake 240ms}
.ans.dim{opacity:.35}
.ans .kbd{position:absolute;top:50%;transform:translateY(-50%)}
.ans:disabled{cursor:default}
/* sheet */
.sheet{margin:0 calc(-1 * var(--gut));padding:20px var(--gut) calc(24px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:14px;animation:up var(--std) 80ms both;position:sticky;bottom:0}
.sheet.ok{background:var(--good);color:var(--good-t)}.sheet.bad{background:var(--crit);color:var(--crit-t)}
@media(min-width:700px){.sheet{position:static;border-radius:0;margin:0 calc(50% - 50vw);padding:24px calc(50vw - 320px) 32px}}
.sheet .h{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;line-height:1;font-family:'Unbounded','Golos Text',sans-serif}
.sheet .h .sep{opacity:.5;font-weight:500}
.sheet .mark{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sheet.ok .mark{background:var(--good-t);color:var(--good)}.sheet.bad .mark{background:var(--crit-t);color:var(--crit)}
.sheet>p,.sheet .vp{margin:0;font-size:15.5px;line-height:1.5;font-weight:500;text-wrap:pretty;opacity:.88}
.sheet .vp code{background:rgba(0,0,0,.14);color:inherit}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;align-items:center;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.sheet .links a,.sheet .links button{color:inherit}
.links button{background:transparent;border:0;padding:0;font:inherit;display:inline-flex;align-items:center;gap:6px}
.links .on{text-decoration:underline;text-underline-offset:4px}.links .wait{opacity:.6}.links button:disabled{cursor:default}
.ref{padding-top:14px;border-top:1px solid rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;animation:up var(--std) both}
.ref .rq{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:inherit;opacity:.75}.ref .rq .cache{margin-left:8px;text-decoration:underline;text-underline-offset:3px}
.ref p{margin:0;color:inherit;font-size:16px;line-height:1.55;opacity:.95;text-wrap:pretty}
.sheet.ok .btn{background:var(--good-t);color:var(--good)}.sheet.bad .btn{background:var(--crit-t);color:var(--crit)}
.sheet .btn .kbd{color:inherit;border-color:currentColor;opacity:.7}
/* gap */
.cloze{font-size:22px;line-height:2.1;font-weight:700;margin:0;text-wrap:pretty}
@media(min-width:700px){.cloze{font-size:26px}}
.inp{display:inline-block;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:18px;font-weight:600;line-height:40px;height:42px;padding:0 12px;margin:0 3px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);text-align:center;vertical-align:middle;outline:none;transition:border-color var(--std),background var(--spring)}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(255,122,89,.18)}
.inp.ok{border-color:var(--good);background:var(--good);color:var(--good-t)}
.inp.bad{border-color:var(--crit);background:var(--crit);color:var(--crit-t);animation:shake 240ms}
/* order */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:grab;user-select:none;transition:border-color var(--std),background var(--std)}
.step .n{width:28px;height:28px;border-radius:8px;background:var(--codebg);color:var(--dim);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.step .sx{flex:1;font-size:16px;font-weight:600;line-height:1.35}
.step .mv{display:flex;gap:6px}
.step .mv button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);display:flex;align-items:center;justify-content:center;padding:0}.step .mv button:active{transform:scale(.9);opacity:.9}
.step.sel{border-color:var(--blue);background:#1a1a2e}
.step.ok{border-color:var(--good)}.step.ok .n{background:var(--good);color:var(--good-t)}
.step.bad{border-color:var(--crit)}.step.bad .n{background:var(--crit);color:var(--crit-t)}
/* voice */
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-family:'Unbounded','Golos Text',sans-serif;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1;color:var(--dim2)}.timer.run{color:var(--fg)}.timer.over{color:var(--crit)}
.tr{border-radius:14px;border:1px solid var(--line);background:var(--panel2);padding:14px 16px;min-height:120px;font-size:16px;line-height:1.55;font-weight:500;color:#e9e4da}
.tr .lab{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--dim2);display:block;margin-bottom:4px}
.rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--crit);margin-right:9px;vertical-align:-1px;box-shadow:0 0 0 4px rgba(255,107,107,.2);animation:blink 1s infinite}
.interim{color:var(--dim2)}
.kill{border-radius:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--crit);color:var(--fg);font-size:15px;line-height:1.5;font-weight:500}.kill b{color:var(--crit);font-weight:800}
.rule{height:1px;background:var(--line);border-radius:1px}
.rev{display:flex;flex-direction:column;gap:12px}
.rev .q{font-size:21px}
.score{display:flex;gap:10px}
.score button{flex:1;height:76px;border-radius:14px;border:1px solid;background:var(--panel);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--fg);transition:transform 120ms,opacity 120ms}
.score button:active{transform:scale(.97);opacity:.9}
.score .k{font-family:'Unbounded','Golos Text',sans-serif;font-size:22px;font-weight:800;line-height:1}
.score .g{border-color:var(--good)}.score .g .k{color:var(--good)}
.score .y{border-color:var(--warn)}.score .y .k{color:var(--warn)}
.score .r{border-color:var(--crit)}.score .r .k{color:var(--crit)}
/* result */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:auto}
.res .n{font-family:'Unbounded','Golos Text',sans-serif;font-size:84px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;animation:num 450ms cubic-bezier(.34,1.56,.64,1) both}
.res .n small{font-size:36px;color:var(--dim2);letter-spacing:0}
.res .v{font-size:22px;font-weight:700;margin-top:16px;animation:fade var(--std) 100ms both}
.res .xp{font-family:'Unbounded','Golos Text',sans-serif;font-size:17px;color:var(--warn);font-weight:700;margin-top:10px;animation:fade var(--std) 140ms both}
.mom{display:flex;gap:10px;width:100%;margin-top:36px}
.mom div{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);animation:up var(--std) both}
.mom div:nth-child(2){animation-delay:40ms}.mom div:nth-child(3){animation-delay:80ms}
.mom b{font-family:'Unbounded','Golos Text',sans-serif;font-size:16px;font-weight:700;color:var(--fg);display:inline-flex;align-items:center;gap:5px}.mom span{font-size:12px;color:var(--dim);font-weight:500}
/* item */
.stt{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);font-weight:600}
.h2{font-family:'Unbounded','Golos Text',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}.h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:700;margin:0}
.missrow{padding-top:10px;border-top:1px solid var(--line)}.missrow:first-of-type{padding-top:0;border-top:0}.missrow p{margin-top:4px;font-size:15px;line-height:1.4}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}@media(min-width:700px){.meta{grid-template-columns:repeat(4,minmax(0,1fr))}}
.meta div{display:flex;flex-direction:column;gap:2px}.meta .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:700}.meta .v{font-size:16px;color:var(--fg);font-weight:700;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}.meta .v.ov{color:var(--warn)}
/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px var(--gut);gap:18px}
.login .wm{font-size:clamp(22px,7vw,30px)}.login form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.login input{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:18px;padding:0 16px;outline:none}.login input:focus{border-color:var(--blue)}
.login .err{color:var(--crit);font-size:14px;font-weight:700;min-height:20px;text-align:center}
/* motion */
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}55%{transform:translateX(6px)}80%{transform:translateX(-3px)}100%{transform:translateX(0)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes num{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes blink{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.pbar i{transition:width var(--std)}}

async function syncCatalog(){ const miss=[]; for(const t of window.TICKETS||[]){ if(t.sec==="parked") continue; for(const id of t.core||[]) if(!DB.items.some(i=>i.id===id)&&!miss.some(m=>m.id===id)) miss.push({id,s:t.sec,t:t.en.topic}); }

function applyLocal(p){ const it=DB.items.find(i=>i.id===p.id); if(!it) return; let h=DB.history.find(x=>x.d===p.d); if(!h){h={d:p.d,ids:[],xp:0};DB.history.push(h)} if(!h.ids.includes(p.id)) h.ids.push(p.id); h.xp=(h.xp||0)+(p.xp||0); if(p.st){it.st=p.st; it.last=p.d;} if(p.mode) it.lastMode=p.mode; }
async function post(path,body){ body.d=TODAY; if(live){try{const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}); if(r.ok){DB=await r.json();return true}}catch{} live=false;} pending.push({...body,path}); localStorage.setItem("drill.pending",JSON.stringify(pending)); applyLocal(body); return false; }
async function flushPending(){ if(!live||!pending.length) return; for(const p of pending.slice()){try{const r=await fetch(p.path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)}); if(r.ok){DB=await r.json(); pending.shift();}}catch{break}} localStorage.setItem("drill.pending",JSON.stringify(pending)); }

function activity(){
  const W=innerWidth>=700?26:18, loc=lang==="ru"?"ru-RU":"en-GB";
  const H=Object.fromEntries(DB.history.filter(x=>x.ids&&x.ids.length).map(x=>[x.d,x]));
  const t=dLocal(TODAY), mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7)); const start=new Date(mon); start.setDate(mon.getDate()-7*(W-1));
  const lvl=c=>c===0?0:c===1?1:c<=3?2:c<=6?3:4;
  const fmt=(dt,o)=>dt.toLocaleDateString(loc,o||{weekday:"short",day:"numeric",month:"short"});
  let cells="",bars="",prevM=-1,activeDays=0,weekDays=[],mlab=[];

    for(let r=0;r<7;r++){ const dt=new Date(wk0); dt.setDate(wk0.getDate()+r); const k=iso(dt); const x=H[k]; const c=x?x.ids.length:0;

  const ds=Object.keys(H).sort(); let best=0,run=0,prev=null; for(const d of ds){ run=prev&&days(prev)-days(d)===1?run+1:1; best=Math.max(best,run); prev=d; }

// which reference paragraph explains this statement: rare shared words (idf over the 3 paragraphs), shared word pairs, and the paragraph's own label
function bestPara(t,text){const tok=x=>(x.toLowerCase().match(/[a-zа-яё0-9_]+(?:\.[0-9]+)?/g)||[]).filter(w=>w.length>=3||/\d/.test(w));
  const q=tok(text), qs=new Set(q), paras=t[lang].a.map(a=>({a,w:tok(a.t),l:new Set(tok(a.q))}));
  const df=w=>paras.filter(p=>p.w.includes(w)).length||1, bi=ws=>new Set(ws.slice(1).map((w,i)=>ws[i]+" "+w)), qb=bi(q);
  let best=paras[0].a,bs=-1; for(const p of paras){const ps=new Set(p.w),pb=bi(p.w);let sc=0; for(const w of qs){if(ps.has(w)) sc+=Math.log(1+paras.length/df(w)); if(p.l.has(w)) sc+=2} for(const b of qb) if(pb.has(b)) sc+=1.5; if(sc>bs){bs=sc;best=p.a}} return best}

function missRecap(missedQ){
  if(!missedQ||!missedQ.length) return "";
  const rows=missedQ.map(({kind,q})=>{const txt=kind==="gap"?q.s.replace(/\[\[(.+?)\]\]/g,(_,a)=>a.split("|")[0]):q.s;
    return `<div class="missrow"><span class="tag">${esc(q.t[lang].topic)}</span><p>${codify(txt)}</p></div>`}).join("");
  return `<div class="card" style="margin-top:20px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left"><span class="h3">${L().missedTitle} · ${missedQ.length}</span>${rows}</div>`;
}
function retryMisses(missedQ,onAllDone){
  const tfQs=missedQ.filter(m=>m.kind==="tf").map(m=>m.q), gapQs=missedQ.filter(m=>m.kind==="gap").map(m=>m.q);
  const afterGap=(c,x)=>{ if(!gapQs.length) return onAllDone(c,tfQs.length,x);
    runGap(gapQs,g=>onAllDone(c+g.correct,tfQs.length+g.total,x+g.xp)); };
  if(tfQs.length) return runTF(tfQs,acc=>afterGap(acc.correct,acc.xp),L().reviewMisses);
  afterGap(0,0);
}

function sentences(t){return t[lang].a.flatMap(a=>a.t.split(/(?<=[.!?])\s+/)).map(s=>s.trim()).filter(s=>{const w=s.split(/\s+/).length;return w>=8&&w<=28&&/^[A-ZА-ЯЁ]/.test(s)&&!/^(Поэтому|Потому|И |А |Плюс|Отсюда|So |And |But |Because|Which|That's|Plus|Then )/.test(s)})}
function buildTF(ids,n=10){
  const ts=ids.map(ticketFor).filter(Boolean); if(!ts.length) return []; const pool=[];
  for(const t of ts){const d=window.DRILLS[t.n]||{}; (d.lies?.[lang]||[]).forEach(s=>pool.push({s,ok:false,t})); shuffle(sentences(t)).slice(0,6).forEach(s=>pool.push({s,ok:true,t}));}
  const secs=new Set(ts.map(t=>t.sec)); const extra=shuffle(window.TICKETS.filter(t=>secs.has(t.sec)&&!ts.includes(t))).slice(0,3);
  for(const t of extra){(window.DRILLS[t.n]?.lies?.[lang]||[]).slice(0,1).forEach(s=>pool.push({s,ok:false,t}))}
  const f=shuffle(pool.filter(p=>!p.ok)).slice(0,Math.ceil(n*0.4)); const tr=shuffle(pool.filter(p=>p.ok)).slice(0,n-f.length); return shuffle(f.concat(tr));
}
function tfScreen(title,q,i,n){ return `<div class="round">${rtop(Math.round(i/n*100))}<div class="body"><span class="tag">${esc(q.t[lang].topic)}</span><p class="stmt">${codify(q.s)}</p></div>
  <div class="act"><div class="pair"><button class="ans" id="f">${kbd("←",1).replace('class="kbd dk"','class="kbd dk" style="left:14px"')}${L().false}</button><button class="ans" id="t">${L().true}${kbd("→",1).replace('class="kbd dk"','class="kbd dk" style="right:14px"')}</button></div><div class="hint"><span>${kbd("Enter")} ${L().hintNext}</span><span>${kbd("M")} ${L().hintMore}</span><span>${kbd("Esc")} ${L().hintQuit}</span></div></div><div id="sheetSlot"></div></div>`; }
function runTF(qs,onDone,title,acc){
  let i=0; acc=acc||{correct:0,xp:0,missedQ:[]}; setTimeout(()=>{},0);
  const step=()=>{ if(i>=qs.length) return onDone(acc);
    const q=qs[i]; app.innerHTML=tfScreen(title,q,i,qs.length); wireQuit(); setCombo(combo);
    const answer=v=>{ if($("#sheet")) return; const ok=v===q.ok; beep(ok); setCombo(ok?combo+1:0); if(ok){acc.correct++;acc.xp+=1}else{acc.missedQ.push({kind:"tf",q})}
      const picked=$(v?"#t":"#f"), other=$(v?"#f":"#t"); picked.classList.add("pick"); if(!ok) picked.classList.add("bad"); other.classList.add("dim"); picked.disabled=other.disabled=true; setProg(i+1,qs.length);
      $("#sheetSlot").innerHTML=sheet({ok,title:ok?L().resok:L().resbad,sub:q.ok?L().true:L().false,text:q.ok?"":q.t[lang].kill,q,btn:ok?"green":"red",btnLabel:L().next});
      wireSheet(q,q.s,()=>{i++;step()}); if(!ok) $("#more").click(); };
    $("#t").onclick=()=>answer(true); $("#f").onclick=()=>answer(false);
    document.onkeydown=e=>{if(e.key==="ArrowRight")answer(true);else if(e.key==="ArrowLeft")answer(false);else if(e.key==="Escape")location.hash="home"};
  }; step();
}
function playTF(id){ combo=0; const qs=buildTF([id]); runTF(qs,acc=>finish(id,"tf",acc.correct,qs.length,acc.xp+(acc.correct===qs.length?3:0),null,acc.missedQ),L().tf); }

// ---------- fill the gap ----------
const norm=s=>s.toLowerCase().replace(/[«»"'`]/g,"").replace(/\s+/g," ").replace(/[–—]/g,"-").trim();
function gapScreen(q,i,n){ const answers=[]; let k=0;
  const html=esc(q.s).replace(/\[\[(.+?)\]\]/g,(_,a)=>{const alts=a.split("|").map(x=>x.trim());answers.push(alts);const w=Math.min(280,Math.max(96,alts[0].length*13+34));return `<input class="inp" id="g${k++}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${w}px">`});
  return {answers,html:`<div class="round">${rtop(Math.round(i/n*100))}<div class="body"><span class="tag">${esc(q.t[lang].topic)}</span><p class="cloze">${html}</p></div><div class="act"><button class="btn blue full big" id="chk">${L().check} ${kbd("Enter",1)}</button></div><div id="sheetSlot"></div></div>`}; }
function runGap(qs,onDone,acc){
  let i=0; acc=acc||{correct:0,total:0,xp:0,missedQ:[]};
  const step=()=>{ if(i>=qs.length) return onDone(acc);
    const q=qs[i]; const {answers,html}=gapScreen(q,i,qs.length); app.innerHTML=html; wireQuit(); setCombo(combo); $("#g0").focus();
    const check=()=>{ if($("#sheet")) return; let all=true; const misses=[];
      answers.forEach((alts,j)=>{const el=$("#g"+j); const v=norm(el.value); const ok=alts.some(a=>norm(a)===v)||(v.length>3&&alts.some(a=>norm(a).startsWith(v)&&v.length>=norm(a).length-1)); el.classList.add(ok?"ok":"bad"); el.disabled=true; acc.total++; if(ok){acc.correct++;acc.xp+=2}else{all=false;misses.push([el.value,alts[0]]); el.value=alts[0]}});
      if(!all) acc.missedQ.push({kind:"gap",q});
      beep(all); setCombo(all?combo+1:0); setProg(i+1,qs.length); $("#chk").closest(".act").style.display="none";
      const text=all?"":misses.map(([v,a])=>`${L().youwrote} <code>${esc(v||"—")}</code> — ${L().correctis} <b>${esc(a)}</b>`).join("<br>");
      const okN=answers.length-misses.length;
      $("#sheetSlot").innerHTML=sheet({ok:all,title:all?L().resok:L().resbad,sub:answers.length>1?`${okN} ${L().of} ${answers.length}`:"",text,q,btn:all?"green":"red",btnLabel:L().next});
      wireSheet(q,q.s.replace(/\[\[(.+?)\]\]/g,(_,a)=>a.split("|")[0]),()=>{i++;step()},bestPara(q.t,q.s.replace(/\[\[(.+?)\]\]/g,(_,a)=>a.replace(/\|/g," ")))); if(!all) $("#more").click(); };
    $("#chk").onclick=check; document.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}else if(e.key==="Escape")location.hash="home"};
  }; step();
}
function playGap(id){ combo=0; const t=ticketFor(id); const qs=shuffle((window.DRILLS[t.n]?.cloze?.[lang]||[]).map(s=>({s,t}))).slice(0,3); if(!qs.length) return home(); runGap(qs,acc=>finish(id,"gap",acc.correct,acc.total,acc.xp,null,acc.missedQ)); }

// ---------- order the steps ----------
function playOrder(id){
  const t=ticketFor(id); const st=window.DRILLS[t.n]?.steps?.[lang]; if(!st) return home(); combo=0;
  let cur=shuffle(st.items.map((s,i)=>i)); if(cur.every((v,i)=>v===i)) cur.reverse(); let sel=null, tries=0;
  const render=(result)=>{
    app.innerHTML=`<div class="round">${rtop(result&&result.ok?100:0,result&&result.ok)}<div class="body"><span class="tag">${esc(t[lang].topic)}</span><p class="q">${esc(st.title)}</p>
      <div class="steps">${cur.map((idx,pos)=>`<div class="step${sel===pos?" sel":""}${result?(idx===pos?" ok":" bad"):""}" data-pos="${pos}" draggable="${!result}"><span class="n">${pos+1}</span><span class="sx">${codify(st.items[idx])}</span><span class="mv"><button data-up="${pos}" aria-label="up">${I.up}</button><button data-dn="${pos}" aria-label="down">${I.down}</button></span></div>`).join("")}</div></div>
      ${result?"":`<div class="act"><button class="btn blue full big" id="chk">${L().check} ${kbd("Enter",1)}</button><div class="hint"><span>${kbd("↑")}${kbd("↓")} ${L().hintMove}</span><span>${kbd("Enter")} ${L().hintCheck}</span></div></div>`}<div id="sheetSlot"></div></div>`;
    wireQuit();
    const move=(a,b)=>{if(b<0||b>=cur.length)return;const v=cur.splice(a,1)[0];cur.splice(b,0,v);sel=b;render()};
    app.querySelectorAll("[data-up]").forEach(b=>b.onclick=e=>{e.stopPropagation();move(+b.dataset.up,+b.dataset.up-1)});
    app.querySelectorAll("[data-dn]").forEach(b=>b.onclick=e=>{e.stopPropagation();move(+b.dataset.dn,+b.dataset.dn+1)});
    app.querySelectorAll(".step").forEach(li=>{const pos=+li.dataset.pos;
      li.onclick=()=>{if(result)return; if(sel===null){sel=pos;render()}else if(sel===pos){sel=null;render()}else move(sel,pos)};
      li.ondragstart=e=>{e.dataTransfer.setData("text",pos)}; li.ondragover=e=>e.preventDefault(); li.ondrop=e=>{e.preventDefault();move(+e.dataTransfer.getData("text"),pos)};});
    const check=()=>{tries++;const n=cur.filter((v,i)=>v===i).length;const ok=n===cur.length;beep(ok);setCombo(ok?combo+1:0);render({ok,n});
      const wrong=cur.map((v,i)=>v!==i?i+1:null).filter(Boolean);
      $("#sheetSlot").innerHTML=sheet({ok,title:ok?L().resok:L().resbad,sub:`${n} ${L().of} ${cur.length} ${L().inplace}`,text:ok?"":`${L().swapped}: ${wrong.join(", ")}`,q:{t,ok:true},btn:ok?"green":"red",btnLabel:ok?L().next:L().tryagain});
      wireSheet({t,ok:true},st.title,ok?()=>finish(id,"order",1,1,tries===1?5:2):()=>render(),bestPara(t,st.title));};
    if($("#chk")) $("#chk").onclick=check;
    if(!result) document.onkeydown=e=>{if(e.key==="Enter")check();else if(e.key==="ArrowUp"&&sel!==null){e.preventDefault();move(sel,sel-1)}else if(e.key==="ArrowDown"&&sel!==null){e.preventDefault();move(sel,sel+1)}else if(e.key==="Escape")location.hash="home"};
  }; render();
}

// ---------- voice ----------
function playVoice(id){
  const t=ticketFor(id); const d=t[lang]; let qi=0, transcripts=["","",""], rec=null, t0=null, tick=null, final="", interim="", recording=false;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const speak=txt=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=lang==="ru"?"ru-RU":"en-US";u.rate=.95;speechSynthesis.speak(u)}catch{}};
  const stopAll=()=>{recording=false;if(rec){try{rec.stop()}catch{}rec=null}if(tick){clearInterval(tick);tick=null}};
  const render=()=>{
    app.innerHTML=`<div class="round">${rtop(Math.round(qi/3*100))}<div class="body" style="gap:10px"><span class="qn">${lang==="ru"?"Вопрос":"Question"} ${qi+1} / 3</span><p class="q">${codify(d.qs[qi])}</p>
      <div class="vrow" style="margin-top:14px"><button class="btn line" id="ask">${I.speaker}${L().ask}</button><button class="btn blue" id="rec">${I.mic}${L().rec}</button><button class="btn red" id="stp" style="display:none">${I.stop}${L().stop}</button><span class="sp"></span><span class="timer" id="tm">0:00</span></div>
      ${SR?"":`<div class="banner" style="margin-top:4px">${I.warn}<span>${L().norec}</span></div>`}
      <div class="tr" id="tr"><span class="lab">${L().said}</span><span class="interim">…</span></div></div>
      <div class="act" style="flex-direction:row;align-items:center"><div class="hint" style="justify-content:flex-start"><span>${kbd("Space")} ${L().hintSpeak}</span><span>${kbd("Enter")} ${L().hintNextQ}</span></div><span class="sp"></span><button class="btn ghost" id="nxq">${qi<2?L().next:L().reveal} ${I.arrow}</button></div></div>`;
    wireQuit();
    const startRec=()=>{ if(recording) return; recording=true; final=transcripts[qi]; interim=""; t0=Date.now(); $("#tm").className="timer run"; $("#rec").style.display="none"; $("#stp").style.display="";
      tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("#tm").textContent=fmt(s);$("#tm").className="timer "+(s>90?"over":"run")},500);
      $("#tr").innerHTML=`<span class="lab">${L().said}</span><span class="rec"></span>${esc(final)}`;
      if(SR){rec=new SR();rec.lang=lang==="ru"?"ru-RU":"en-US";rec.continuous=true;rec.interimResults=true;
        rec.onresult=e=>{interim="";for(let k=e.resultIndex;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)final+=r[0].transcript+" ";else interim+=r[0].transcript}transcripts[qi]=final;$("#tr").innerHTML=`<span class="lab">${L().said}</span><span class="rec"></span>${esc(final)}<span class="interim">${esc(interim)}</span>`};
        rec.onend=()=>{if(recording&&rec){try{rec.start()}catch{}}}; try{rec.start()}catch{}} };
    const stopRec=()=>{ if(!recording) return; stopAll(); transcripts[qi]=final; $("#rec").style.display=""; $("#stp").style.display="none"; $("#tr").innerHTML=`<span class="lab">${L().said}</span>${esc(final)||`<span class="interim">—</span>`}`; };
    $("#ask").onclick=()=>speak(d.qs[qi]); $("#rec").onclick=startRec; $("#stp").onclick=stopRec;
    $("#nxq").onclick=()=>{ stopAll(); if(qi<2){qi++;render()} else reveal(); };
    document.onkeydown=e=>{if(e.key===" "&&!e.target.closest("input")){e.preventDefault();recording?stopRec():startRec()}else if(e.key==="Enter"){$("#nxq").click()}else if(e.key==="Escape"){stopAll();location.hash="home"}};
  };
  const reveal=()=>{ try{speechSynthesis.cancel()}catch{}
    const ids=t.core.filter(c=>byId(c)&&byId(c).st!=="parked"); if(!ids.length) ids.push(id);
    app.innerHTML=`<div class="round" style="min-height:0">${rtop(100,true)}<h2 class="h2" style="margin-top:28px">${L().reveal}</h2>
      ${d.qs.map((q,k)=>`<div class="rev" style="margin-top:28px"><span class="qn">${k+1} / 3</span><p class="q">${codify(q)}</p>${transcripts[k]?`<div class="tr" style="min-height:0;padding:12px 14px"><span class="lab">${L().said}</span>${esc(transcripts[k])}</div>`:""}<div class="ref" style="border-top:0;padding-top:4px"><span class="rq">${L().reference}</span><p>${codify(d.a[k].t)}</p></div><div class="kill"><b>${L().killh}:</b> ${d.kill}</div></div>${k<2?`<div class="rule" style="margin-top:28px"></div>`:""}`).join("")}
      <div class="card" style="margin-top:28px;padding:20px;display:flex;flex-direction:column;gap:14px;border-color:#3d4f5a"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:18px;font-weight:900">${L().selfscore}</span><span class="sub">${L().selfsub.replace("#ID",ids.map(x=>"#"+x).join(", "))}</span></div>
      <div class="score"><button class="g" data-s="green"><span class="k">✓</span>${L().g}</button><button class="y" data-s="yellow"><span class="k">~</span>${L().y}</button><button class="r" data-s="red"><span class="k">✗</span>${L().r}</button></div>
      <div class="hint" style="justify-content:flex-start"><span>${kbd("1")} ${L().cold}</span><span>${kbd("2")} ${L().shaky}</span><span>${kbd("3")} ${L().missed}</span></div></div><div style="height:40px"></div></div>`;
    wireQuit();
    const scoreIt=async st=>{ const xp={green:10,yellow:6,red:3}[st]; beep(st!=="red"); const was=streak(), xpWas=xpToday();
      for(const cid of ids) await post("/api/done",{id:cid,st,mode:"voice",xp:cid===ids[0]?xp:0,transcript:transcripts.join(" | ").slice(0,600)});
      lastChanged=ids[0];
      app.innerHTML=`<div class="round">${rtop(100,true)}<div class="res"><span class="tag">${ids.map(x=>"#"+x).join(", ")} → ${L().statuses[st]}</span><div class="n" style="margin-top:24px;color:${{green:"var(--good)",yellow:"var(--warn)",red:"var(--crit)"}[st]}">${{green:"✓",yellow:"~",red:"✗"}[st]}</div><div class="v">${{green:L().g,yellow:L().y,red:L().r}[st]}</div><div class="xp">+${xp} XP</div><div class="mom">${momTiles(was,xpWas)}</div></div>
        <div class="act" style="flex-direction:row;gap:12px;margin-top:36px"><button class="btn green full big" id="hm">${L().home} ${kbd("Enter",1)}</button></div></div>`;
      wireQuit(); $("#hm").onclick=()=>location.hash="home"; document.onkeydown=e=>{if(e.key==="Enter"||e.key==="Escape")location.hash="home"}; };
    app.querySelectorAll(".score button").forEach(b=>b.onclick=()=>scoreIt(b.dataset.s));
    document.onkeydown=e=>{if(e.key==="1")scoreIt("green");else if(e.key==="2")scoreIt("yellow");else if(e.key==="3")scoreIt("red");else if(e.key==="Escape")location.hash="home"};
  };
  render();
}

// ---------- quick round ----------
function quick(){
  const d=due().slice(0,3).map(i=>i.id); const nn=nextNew(); const ids=d.length?d:(nn?[nn.id]:[17]); combo=0;
  const qs=buildTF(ids,8);
  runTF(qs,acc=>{ const ts=ids.map(ticketFor).filter(Boolean); const gq=shuffle(ts.flatMap(t=>(window.DRILLS[t.n]?.cloze?.[lang]||[]).map(s=>({s,t})))).slice(0,5);
    runGap(gq,g=>finish(ids[0],"quick",acc.correct+g.correct,qs.length+g.total,acc.xp+g.xp,ids,acc.missedQ.concat(g.missedQ))); },L().quick);
}

// ---------- router ----------
function route(){
  document.onkeydown=null; try{speechSynthesis.cancel()}catch{} window.scrollTo(0,0);
  if(needLogin) return loginScreen();
  const h=location.hash.slice(1)||"home"; const [scr,a,b]=h.split("/");
  if(scr==="play"){const id=+a; if(!byId(id)) return home(); ({tf:playTF,gap:playGap,order:playOrder,voice:playVoice}[b]||home)(id); return;}
  if(scr==="quick") return quick();
  if(scr==="item") return itemScreen(+a);
  home();
}
window.addEventListener("hashchange",()=>route());
loadState().then(async()=>{await flushPending(); route();});
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10191e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="drill">
<title>drill — core-40</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* ===== tokens (from the Claude Design canvas) ===== */
:root{--bg:#10191e;--panel:#1b262d;--line:#2d3b44;--codebg:#243239;--fg:#f2f7fa;--dim:#9fb0ba;--dim2:#6a7d88;--dim3:#4a5a64;
  --blue:#2bb3f5;--blue-e:#1d8fc7;--good:#5ecf3a;--good-e:#47a82b;--good-t:#0d2506;--warn:#ffc93c;--warn-e:#d9a521;--warn-t:#3a2a00;--crit:#ff5252;--crit-e:#c93a3a;
  --good-s:#1c3324;--good-st:#8ee66f;--crit-s:#3a1d1f;--crit-st:#ff8a8a;--fire:#ff9d2e;--l1:#1d6a9c;--l2:#2bb3f5;--l3:#8fdcff;
  --std:200ms cubic-bezier(.2,0,0,1);--spring:350ms cubic-bezier(.34,1.56,.64,1);--gut:20px}
@media(min-width:700px){:root{--gut:32px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;font-weight:600;-webkit-font-smoothing:antialiased;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
a{color:var(--blue);text-decoration:none}a:hover{color:#5ec6ff}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
code{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;font-size:.86em;background:var(--codebg);padding:2px 7px;border-radius:8px;color:#c9e6f5;white-space:nowrap}
svg{flex:none}
.sp{flex:1}
/* header */
.hdr{display:flex;align-items:center;gap:10px;height:64px;padding:0 var(--gut);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top);box-sizing:content-box}
.wm{font-weight:900;font-size:22px;letter-spacing:-.02em;color:var(--fg);display:inline-flex;align-items:baseline;gap:7px}.wm:hover{color:var(--fg)}
.wm small{font-size:11px;font-weight:800;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:16px}.stat.fire{color:var(--fire)}.stat.xp{color:var(--warn)}
.icb{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 0 var(--line)}
.icb.off{opacity:.45}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;height:40px;box-shadow:0 2px 0 var(--line)}
.seg button{border:0;background:transparent;color:var(--dim);font-weight:900;font-size:13px;padding:0 12px;letter-spacing:.06em}.seg button.on{background:var(--line);color:var(--fg)}
/* page */
.page{max-width:964px;margin:0 auto;padding:24px var(--gut) 48px;display:flex;flex-direction:column}
.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:900;display:flex;justify-content:space-between;align-items:baseline;margin-top:32px}.sec:first-child{margin-top:0}
.sec .r{letter-spacing:0;text-transform:none;font-size:14px;color:var(--dim);font-weight:800}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;margin-top:10px}
.item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-top:2px solid var(--line)}.item:first-child{border-top:0}
.sw{width:14px;height:14px;border-radius:5px;margin-top:5px;flex:none;position:relative}
.sw.green{background:var(--good)}.sw.yellow{background:var(--warn)}.sw.red{background:var(--crit)}.sw.new{border:2px dashed var(--dim2)}.sw.parked{background:repeating-linear-gradient(135deg,#3a4a54 0 2px,transparent 2px 4px)}.sw.ship{background:var(--blue)}
.sw.due::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--panel)}
.it{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .t{font-size:17px;font-weight:800;line-height:1.3}.it .t .id{color:var(--dim2);margin-right:6px}
.it .s{font-size:14px;color:var(--dim);font-weight:700}.it .s .ov{color:var(--warn);font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--dim);font-size:14px;font-weight:800;box-shadow:0 3px 0 var(--line);text-transform:uppercase;letter-spacing:.04em;transition:transform 120ms,box-shadow 120ms}
.chip:hover{color:var(--fg)}.chip:active{transform:translateY(3px);box-shadow:none;transition-duration:60ms}
.chip.hot{border-color:var(--blue);color:var(--blue);box-shadow:0 3px 0 var(--blue-e)}
@media(min-width:700px){.item{align-items:center;padding:12px 16px}.it .chips{display:none}.item>.chips{margin-top:0}.chip{height:34px;padding:0 10px;font-size:12px;border-radius:10px;box-shadow:0 2px 0 var(--line)}.chip:active{transform:translateY(2px)}}
@media(max-width:699px){.item>.chips{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:16px;border:0;font-weight:900;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg);flex:none;transition:transform 120ms,box-shadow 120ms}
.btn:active,.btn.press{transform:translateY(4px)!important;box-shadow:none!important;transition-duration:60ms}
.btn.blue{background:var(--blue);color:#07202c;box-shadow:0 4px 0 var(--blue-e)}
.btn.green{background:var(--good);color:var(--good-t);box-shadow:0 4px 0 var(--good-e)}
.btn.red{background:var(--crit);color:#fff;box-shadow:0 4px 0 var(--crit-e)}
.btn.line{background:transparent;border:2px solid var(--line);color:var(--blue);box-shadow:0 4px 0 var(--line)}
.btn.grey{background:var(--line);color:var(--dim2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--dim);box-shadow:none;padding:0 8px}.btn.ghost:hover{color:var(--fg)}
.btn.full{width:100%}.btn.big{height:56px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default;transform:none!important}
.kbd{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:var(--dim2);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 6px;line-height:1.5;white-space:nowrap}
.hint{font-size:13px;color:var(--dim2);font-weight:700;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
@media(max-width:699px){.hint,.kbd.dk{display:none}}
.quick{margin-top:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quick .qt{font-size:18px;font-weight:900}.quick .qt span{color:var(--dim2);font-weight:800;font-size:14px;margin-left:6px}
.sub{font-size:14px;color:var(--dim);line-height:1.45;font-weight:700;margin:0}
@media(min-width:700px){.quick{flex-direction:row;align-items:center;gap:20px;padding:16px 16px 16px 20px}.quick .qi{flex:1}.quick .btn{width:180px}}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:2px solid #7a5f1a;background:#2c2410;color:#ffd968;font-size:13.5px;line-height:1.4;font-weight:700;margin-top:16px}.banner code{background:#3d3316;color:#ffe08a;white-space:normal}
/* wall */
.wall{display:flex;flex-wrap:wrap;gap:16px 22px;padding:16px}
.wsec{display:flex;flex-direction:column;gap:8px}
.wlab{font-size:12px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase;font-weight:900;display:flex;justify-content:space-between;gap:12px}.wlab .c{letter-spacing:0;text-transform:none;color:var(--dim);font-weight:800}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{width:40px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;position:relative;border:2px solid var(--line);background:var(--panel);color:var(--dim);box-shadow:0 3px 0 var(--line);padding:0;transition:background var(--spring),border-color var(--spring),transform 120ms,box-shadow 120ms}
.cell:active{transform:translateY(3px);box-shadow:none}
.cell.green{background:var(--good);border-color:var(--good);color:var(--good-t);box-shadow:0 3px 0 var(--good-e)}
.cell.yellow{background:var(--warn);border-color:var(--warn);color:var(--warn-t);box-shadow:0 3px 0 var(--warn-e)}
.cell.red{background:var(--crit);border-color:var(--crit);color:#fff;box-shadow:0 3px 0 var(--crit-e)}
.cell.new{border-style:dashed;background:transparent;box-shadow:none;color:var(--dim2)}
.cell.parked{background:repeating-linear-gradient(135deg,var(--panel) 0 3px,var(--line) 3px 5px);color:var(--dim3);box-shadow:none;cursor:default}
.cell.due::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--bg)}
.cell.pop{animation:pop var(--spring)}
@media(min-width:700px){.cell{width:36px;height:34px;font-size:13px;border-radius:9px}}
.heat{display:flex;gap:4px}.wk{display:flex;flex-direction:column;gap:4px}
.dy{width:13px;height:13px;border-radius:4px;background:var(--panel);border:1.5px solid var(--line);transition:background var(--std)}
.dy.l1{background:var(--l1);border-color:var(--l1)}.dy.l2{background:var(--l2);border-color:var(--l2)}.dy.l3{background:var(--l3);border-color:var(--l3)}
.dy.today{box-shadow:0 0 0 2px var(--fg)}
@media(min-width:700px){.dy{width:15px;height:15px}}
.hcard{padding:16px;display:flex;flex-direction:column;gap:10px}.hrow{display:flex;gap:10px;align-items:flex-start;overflow-x:auto}
.dows{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:800;color:var(--dim2);line-height:13px}@media(min-width:700px){.dows{line-height:15px}}
.months{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--dim2)}
/* rounds */
.round{max-width:640px;margin:0 auto;padding:20px var(--gut) 0;display:flex;flex-direction:column;min-height:100dvh}
@media(min-width:700px){.round{padding-top:32px}}
.rtop{display:flex;align-items:center;gap:14px}
.x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--dim2);background:transparent;border:0;padding:0;margin-left:-6px}.x:hover{color:var(--fg)}
.pbar{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:8px;position:relative;transition:width var(--std),background var(--std)}
.pbar i::after{content:"";position:absolute;left:10px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.pbar.ok i{background:var(--good)}
.combo{font-weight:900;color:var(--warn);font-size:16px;display:inline-flex;align-items:center;gap:3px;min-width:40px;justify-content:flex-end}
.combo.pop{animation:pop var(--spring)}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:900}
.stmt{font-size:24px;line-height:1.3;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:pretty}
.qn{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:900}
.q{font-size:24px;line-height:1.3;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:pretty}
@media(min-width:700px){.stmt{font-size:30px}.q{font-size:28px}}
.body{display:flex;flex-direction:column;gap:16px;margin-top:28px}
@media(min-width:700px){.body{margin-top:48px}}
.act{margin-top:auto;padding:24px 0 calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.pair{display:flex;gap:12px}
.ans{position:relative;flex:1;height:68px;border-radius:16px;border:2px solid var(--line);background:var(--panel);color:var(--fg);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 var(--line);padding:0;transition:transform 120ms,box-shadow 120ms,background var(--spring),border-color var(--spring),color var(--spring),opacity var(--std)}
.ans:active{transform:translateY(4px);box-shadow:none;transition-duration:60ms}
.ans.pick{border-color:var(--good);background:var(--good-s);color:var(--good-st);box-shadow:0 4px 0 #2d5a36;animation:pop var(--spring)}
.ans.pick.bad{border-color:var(--crit);background:var(--crit-s);color:var(--crit-st);box-shadow:0 4px 0 #7a2b2b;animation:shake 240ms}
.ans.dim{opacity:.35;box-shadow:none;transform:translateY(4px)}
.ans .kbd{position:absolute;top:50%;transform:translateY(-50%)}
.ans:disabled{cursor:default}
/* sheet */
.sheet{margin:0 calc(-1 * var(--gut));padding:20px var(--gut) calc(24px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:14px;animation:up var(--std) 80ms both;position:sticky;bottom:0}
.sheet.ok{background:var(--good-s)}.sheet.bad{background:var(--crit-s)}
@media(min-width:700px){.sheet{position:static;border-radius:0;margin:0 calc(50% - 50vw);padding:24px calc(50vw - 320px) 32px}}
.sheet .h{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900;line-height:1}
.sheet.ok .h{color:var(--good-st)}.sheet.bad .h{color:var(--crit-st)}
.sheet .h .sep{opacity:.5;font-weight:700}
.sheet .mark{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sheet.ok .mark{background:var(--good);color:var(--good-t)}.sheet.bad .mark{background:var(--crit);color:#fff}
.sheet>p,.sheet .vp{margin:0;font-size:15.5px;line-height:1.5;font-weight:600;text-wrap:pretty}
.sheet.ok>p,.sheet.ok .vp{color:#c6efb8}.sheet.bad>p,.sheet.bad .vp{color:#f5c4c4}
.sheet .vp code{background:rgba(0,0,0,.25);color:inherit}
.links{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;align-items:center}
.sheet.ok .links a,.sheet.ok .links button{color:var(--good-st)}.sheet.bad .links a,.sheet.bad .links button{color:var(--crit-st)}
.links button{background:transparent;border:0;padding:0;font:inherit;display:inline-flex;align-items:center;gap:6px;letter-spacing:inherit;text-transform:inherit;font-weight:inherit}
.links .on{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}.links .wait{opacity:.6}.links button:disabled{cursor:default}
.ref{padding-top:14px;border-top:2px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px;animation:up var(--std) both}
.ref .rq{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:900;color:var(--dim)}.ref .rq .cache{color:var(--blue);margin-left:8px}
.ref p{margin:0;color:#e9f1f5;font-size:16px;line-height:1.55;font-weight:600;text-wrap:pretty}
/* gap */
.cloze{font-size:22px;line-height:2.1;font-weight:800;margin:0;text-wrap:pretty}
@media(min-width:700px){.cloze{font-size:26px}}
.inp{display:inline-block;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:18px;font-weight:600;line-height:40px;height:44px;padding:0 12px;margin:0 3px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);text-align:center;vertical-align:middle;box-shadow:0 3px 0 var(--line);outline:none;transition:border-color var(--std),background var(--spring)}
.inp:focus{border-color:var(--blue);box-shadow:0 3px 0 var(--blue-e)}
.inp.ok{border-color:var(--good);background:var(--good-s);color:var(--good-st);box-shadow:0 3px 0 var(--good-e)}
.inp.bad{border-color:var(--crit);background:var(--crit-s);color:var(--crit-st);box-shadow:0 3px 0 var(--crit-e);animation:shake 240ms}
/* order */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);box-shadow:0 3px 0 var(--line);cursor:grab;user-select:none;transition:border-color var(--std),background var(--std)}
.step .n{width:28px;height:28px;border-radius:9px;background:var(--line);color:var(--dim);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.step .sx{flex:1;font-size:16px;font-weight:700;line-height:1.35}
.step .mv{display:flex;gap:6px}
.step .mv button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--dim);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 0 var(--line)}.step .mv button:active{transform:translateY(2px);box-shadow:none}
.step.sel{border-color:var(--blue);background:#16303f;box-shadow:0 3px 0 var(--blue-e)}
.step.ok{border-color:var(--good);box-shadow:0 3px 0 var(--good-e)}.step.ok .n{background:var(--good);color:var(--good-t)}
.step.bad{border-color:var(--crit);box-shadow:0 3px 0 var(--crit-e)}.step.bad .n{background:var(--crit);color:#fff}
/* voice */
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;line-height:1;color:var(--dim2)}.timer.run{color:var(--fg)}.timer.over{color:var(--crit)}
.tr{border-radius:16px;border:2px solid var(--line);background:var(--bg);padding:14px 16px;min-height:120px;font-size:16px;line-height:1.55;font-weight:600;color:#e9f1f5}
.tr .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:900;color:var(--dim2);display:block;margin-bottom:4px}
.rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--crit);margin-right:9px;vertical-align:-1px;box-shadow:0 0 0 4px rgba(255,82,82,.22);animation:blink 1s infinite}
.interim{color:var(--dim2)}
.kill{border-radius:14px;padding:12px 14px;background:var(--crit-s);border:2px solid #7a2b2b;color:#f5c4c4;font-size:15px;line-height:1.5;font-weight:600}.kill b{color:var(--crit-st);font-weight:900}
.rule{height:2px;background:var(--line);border-radius:1px}
.rev{display:flex;flex-direction:column;gap:12px}
.rev .q{font-size:21px}
.score{display:flex;gap:10px}
.score button{flex:1;height:76px;border-radius:16px;border:2px solid;background:var(--panel);font-weight:900;font-size:13px;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;transition:transform 120ms,box-shadow 120ms}
.score button:active{transform:translateY(4px);box-shadow:none!important}
.score .k{font-size:24px;font-weight:900;line-height:1}
.score .g{border-color:var(--good);box-shadow:0 4px 0 #2d5a36;color:var(--good-st)}
.score .y{border-color:var(--warn);box-shadow:0 4px 0 #7a5f1a;color:#ffd968}
.score .r{border-color:var(--crit);box-shadow:0 4px 0 #7a2b2b;color:var(--crit-st)}
/* result */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:auto}
.res .n{font-size:100px;font-weight:900;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;animation:num 450ms cubic-bezier(.34,1.56,.64,1) both}
.res .n small{font-size:44px;color:var(--dim2);letter-spacing:0}
.res .v{font-size:22px;font-weight:800;margin-top:14px;animation:fade var(--std) 100ms both}
.res .xp{font-size:18px;color:var(--warn);font-weight:900;margin-top:8px;animation:fade var(--std) 140ms both}
.mom{display:flex;gap:10px;width:100%;margin-top:36px}
.mom div{flex:1;border:2px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);animation:up var(--std) both}
.mom div:nth-child(2){animation-delay:40ms}.mom div:nth-child(3){animation-delay:80ms}
.mom b{font-size:18px;font-weight:900;color:var(--fg);display:inline-flex;align-items:center;gap:5px}.mom span{font-size:12px;color:var(--dim);font-weight:700}
/* item */
.stt{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);font-weight:800}
.h2{font-size:26px;font-weight:900;letter-spacing:-.01em;margin:0}.h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:900;margin:0}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}@media(min-width:700px){.meta{grid-template-columns:repeat(4,minmax(0,1fr))}}
.meta div{display:flex;flex-direction:column;gap:2px}.meta .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:900}.meta .v{font-size:16px;color:var(--fg);font-weight:800}.meta .v.ov{color:var(--warn)}
/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px var(--gut);gap:18px}
.login .wm{font-size:34px}.login form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.login input{height:52px;border-radius:16px;border:2px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:18px;padding:0 16px;outline:none;box-shadow:0 3px 0 var(--line)}.login input:focus{border-color:var(--blue)}
.login .err{color:var(--crit-st);font-size:14px;font-weight:800;min-height:20px;text-align:center}
/* motion */
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}55%{transform:translateX(6px)}80%{transform:translateX(-3px)}100%{transform:translateX(0)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes num{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes blink{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.pbar i{transition:width var(--std)}}

};
// ---------- i18n ----------
const UI={

     wall:"Стена",sessions:"Сессии",offline:"Офлайн · результаты копятся локально. Запусти <code>node today.mjs serve</code> и открой <code>localhost:4040/drill.html</code>.",

};
const SEC={llm:"LLM",rag:"RAG",agents:"Agents",sysd:"System design",behav:"Behavioral",bonus:"Depth",meta:"Meta",js:"JS/TS",react:"React"};
const INTERVAL={red:1,yellow:3,green:7};
const NEW_ORDER=[38,39,22,25,23,32,27,28,29,30,31,40,35,36,37,42];
let lang=localStorage.getItem("drill.lang")||"ru";
const L=()=>UI[lang];
const $=s=>document.querySelector(s); const app=$("#app");
const iso=d=>d.toISOString().slice(0,10); const TODAY=iso(new Date());
const days=f=>Math.floor((new Date(TODAY)-new Date(f))/864e5);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// wrap code-ish tokens (max_tokens, tool_result, text/event-stream, temperature = 0) in <code>
const codify=s=>esc(s).replace(/\b([a-z]+_[a-z_]+|text\/event-stream|[A-Za-z]+\.[a-z]+\(\)|temperature = 0|temp 0|top_p|top_k|BM25|HNSW|pgvector)\b/g,'<code>$1</code>');
const fmtDate=()=>new Date().toLocaleDateString(lang==="ru"?"ru-RU":"en-GB",{weekday:"short",day:"numeric",month:"short"});

// ---------- state ----------
let DB=window.STATE||{items:[],history:[]}, live=false;
let pending=JSON.parse(localStorage.getItem("drill.pending")||"[]");
let needLogin=false;
async function loadState(){ needLogin=false; try{const r=await fetch("/api/state",{cache:"no-store"}); if(r.ok){DB=await r.json(); live=true;} else if(r.status===401){needLogin=true;}}catch{} if(!live&&!needLogin) for(const p of pending) applyLocal(p); }
function loginScreen(err){
  app.innerHTML=`<div class="login"><a class="wm">drill<small>core-40</small></a><form id="lf"><input type="password" id="pw" placeholder="${L().pw}" autocomplete="current-password" autofocus><button class="btn blue full big" type="submit">${L().enter}</button><div class="err">${err||""}</div></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault(); const b=$("#lf button"); b.disabled=true;
    try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#pw").value})});
      if(r.ok){await loadState(); await flushPending(); return route();} const j=await r.json().catch(()=>({})); loginScreen(r.status===401?L().wrongpw:(j.error||L().noserver));}
    catch(e){loginScreen(e.message)} };
}
function applyLocal(p){ const it=DB.items.find(i=>i.id===p.id); if(!it) return; let h=DB.history.find(x=>x.d===p.d); if(!h){h={d:p.d,ids:[],xp:0};DB.history.push(h)} if(!h.ids.includes(p.id)) h.ids.push(p.id); h.xp=(h.xp||0)+(p.xp||0); if(p.st){it.st=p.st; it.last=p.d;} if(p.mode) it.lastMode=p.mode; }
async function post(path,body){ body.d=TODAY; if(live){try{const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}); if(r.ok){DB=await r.json();return true}}catch{} live=false;} pending.push({...body,path}); localStorage.setItem("drill.pending",JSON.stringify(pending)); applyLocal(body); return false; }
async function flushPending(){ if(!live||!pending.length) return; for(const p of pending.slice()){try{const r=await fetch(p.path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)}); if(r.ok){DB=await r.json(); pending.shift();}}catch{break}} localStorage.setItem("drill.pending",JSON.stringify(pending)); }
const byId=id=>DB.items.find(i=>i.id===id);
const ticketFor=id=>window.TICKETS.find(t=>(t.core||[]).includes(id));
const due=()=>DB.items.filter(i=>INTERVAL[i.st]&&i.last).map(i=>({...i,over:days(i.last)-INTERVAL[i.st]})).filter(i=>i.over>=0).sort((a,b)=>b.over-a.over);
const isDue=i=>!!(i.last&&INTERVAL[i.st]&&days(i.last)-INTERVAL[i.st]>=0);
const nextNew=()=>NEW_ORDER.map(byId).find(i=>i&&i.st==="new");
function streak(){const set=new Set(DB.history.map(h=>h.d));let n=0,d=new Date(TODAY);if(!set.has(TODAY)) d.setDate(d.getDate()-1);while(set.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
const xpToday=()=>(DB.history.find(h=>h.d===TODAY)||{}).xp||0;
let lastChanged=null; // cell id to pop on Home

// ---------- sound ----------
let snd=localStorage.getItem("drill.snd")!=="off"; let AC=null;
function beep(ok){ if(!snd) return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime;
  const tone=(f,st,dur,type="sine",g=.08)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,t+st);v.gain.exponentialRampToValueAtTime(.0001,t+st+dur);o.connect(v);v.connect(AC.destination);o.start(t+st);o.stop(t+st+dur)};
  if(ok){tone(660,0,.09);tone(880,.09,.14)} else tone(180,0,.16,"sawtooth",.05);}catch{} }

// ---------- shared pieces ----------
const kbd=(k,dk)=>`<span class="kbd${dk?" dk":""}">${k}</span>`;
function header(){ return `<header class="hdr"><a class="wm" href="#home">drill<small>core-40</small></a><span class="sp"></span><span class="stat fire">${I.flame}${streak()}</span><span class="stat xp" style="margin-left:6px">${I.bolt}${xpToday()}</span><button class="icb${snd?"":" off"}" id="snd" aria-label="sound" style="margin-left:8px">${I.sound}</button>${DB.auth?`<button class="icb" id="lo" aria-label="${L().logout}" title="${L().logout}">${I.out}</button>`:""}<div class="seg"><button id="ru" class="${lang==="ru"?"on":""}">RU</button><button id="en" class="${lang==="en"?"on":""}">EN</button></div></header>`; }
function wireHeader(){ const lo=$("#lo"); if(lo) lo.onclick=async()=>{await fetch("/api/logout",{method:"POST"}); DB={items:[],history:[]}; live=false; loginScreen();}; const r=$("#ru"),e=$("#en"),s=$("#snd"); if(r) r.onclick=()=>{lang="ru";localStorage.setItem("drill.lang",lang);route()}; if(e) e.onclick=()=>{lang="en";localStorage.setItem("drill.lang",lang);route()}; if(s) s.onclick=()=>{snd=!snd;localStorage.setItem("drill.snd",snd?"on":"off");s.classList.toggle("off",!snd);beep(true)}; }
const MODE_ICON={voice:I.mic14,tf:I.bolt13,gap:I.pen,order:I.sort,ticket:I.doc};
function chips(id,hot){ const t=ticketFor(id); if(!t) return ""; const d=window.DRILLS[t.n]||{};
  const b=(m,label)=>`<button class="chip${hot===m?" hot":""}" onclick="location.hash='play/${id}/${m}'">${MODE_ICON[m]}${label}</button>`;
  return `<div class="chips">${b("voice",L().voice)}${b("tf","T/F")}${d.cloze?b("gap",L().gap):""}${d.steps?b("order",L().order):""}<a class="chip" href="exam-tickets.html#t${t.n}">${I.doc}${L().ticket} ${t.n}</a></div>`; }
function itemRow(i,sub){ const st=i.st||"new"; return `<div class="item"><span class="sw ${st}${isDue(i)?" due":""}"></span><div class="it"><div class="t"><span class="id">#${i.id}</span>${esc(i.t)}</div><div class="s">${sub}</div>${chips(i.id)}</div>${chips(i.id)}</div>`; }
function rtop(pct,ok){ return `<div class="rtop"><button class="x" id="quit" aria-label="${L().quit}">${I.x}</button><div class="pbar${ok?" ok":""}" id="pbar"><i style="width:${pct}%"></i></div><span class="combo" id="combo"></span></div>`; }
let combo=0; function setCombo(n){combo=n;const c=$("#combo");if(!c)return;if(n>=2){c.innerHTML=I.bolt13+"×"+n;c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}else c.innerHTML=""}
function setProg(i,n){const p=$("#pbar");if(!p)return;p.querySelector("i").style.width=Math.round(i/n*100)+"%";if(i>=n)p.classList.add("ok")}
const wireQuit=()=>{const q=$("#quit");if(q)q.onclick=()=>{location.hash="home"}};

// ---------- home ----------
function home(){
  const d=due(), nn=nextNew(); const top=d.slice(0,2); const active=DB.items.filter(i=>i.st!=="parked"); const n=s=>active.filter(i=>i.st===s).length;
  let h=header()+`<div class="page"><div class="sec"><span>${L().today}</span><span class="r">${fmtDate()}</span></div><div class="card">`;
  h+=top.length?top.map(i=>itemRow(i,`${L().due} · <span class="ov">${i.over}${L().days} ${L().overdue}</span>`)).join(""):`<div class="item"><div class="it"><div class="s">${L().nothing}</div></div></div>`;
  if(nn) h+=itemRow(nn,L().newi);
  if(DB.today_overrides?.ship) h+=`<div class="item" style="align-items:center"><span class="sw ship" style="margin-top:0"></span><div class="it"><div class="t"><span class="id">${L().ship}</span>${esc(DB.today_overrides.ship)}</div></div></div>`;
  h+=`</div>`;

function bestPara(t,text){const words=new Set((text.toLowerCase().match(/[a-zа-яё0-9_]{4,}/g)||[]));let best=t[lang].a[0],bs=-1;for(const a of t[lang].a){const w=a.t.toLowerCase().match(/[a-zа-яё0-9_]{4,}/g)||[];const sc=w.filter(x=>words.has(x)).length/Math.sqrt(w.length||1);if(sc>bs){bs=sc;best=a}}return best}

}

function finish(id,mode,correct,total,xp,ids){

function sentences(t){return t[lang].a.flatMap(a=>a.t.split(/(?<=[.!?])\s+/)).map(s=>s.trim()).filter(s=>{const w=s.split(/\s+/).length;return w>=8&&w<=28&&/^[A-ZА-ЯЁ]/.test(s)&&!/^(Поэтому|Потому|И |А |Плюс|Отсюда|So |And |But |Because|Which|That's|Plus|Then )/.test(s)})}
function buildTF(ids,n=10){
  const ts=ids.map(ticketFor).filter(Boolean); if(!ts.length) return []; const pool=[];
  for(const t of ts){const d=window.DRILLS[t.n]||{}; (d.lies?.[lang]||[]).forEach(s=>pool.push({s,ok:false,t})); shuffle(sentences(t)).slice(0,6).forEach(s=>pool.push({s,ok:true,t}));}
  const secs=new Set(ts.map(t=>t.sec)); const extra=shuffle(window.TICKETS.filter(t=>secs.has(t.sec)&&!ts.includes(t))).slice(0,3);
  for(const t of extra){(window.DRILLS[t.n]?.lies?.[lang]||[]).slice(0,1).forEach(s=>pool.push({s,ok:false,t}))}
  const f=shuffle(pool.filter(p=>!p.ok)).slice(0,Math.ceil(n*0.4)); const tr=shuffle(pool.filter(p=>p.ok)).slice(0,n-f.length); return shuffle(f.concat(tr));
}
function tfScreen(title,q,i,n){ return `<div class="round">${rtop(Math.round(i/n*100))}<div class="body"><span class="tag">${esc(q.t[lang].topic)}</span><p class="stmt">${codify(q.s)}</p></div>

function runTF(qs,onDone,title,acc){
  let i=0; acc=acc||{correct:0,xp:0}; setTimeout(()=>{},0);
  const step=()=>{ if(i>=qs.length) return onDone(acc);
    const q=qs[i]; app.innerHTML=tfScreen(title,q,i,qs.length); wireQuit(); setCombo(combo);
    const answer=v=>{ if($("#sheet")) return; const ok=v===q.ok; beep(ok); setCombo(ok?combo+1:0); if(ok){acc.correct++;acc.xp+=1}
      const picked=$(v?"#t":"#f"), other=$(v?"#f":"#t"); picked.classList.add("pick"); if(!ok) picked.classList.add("bad"); other.classList.add("dim"); picked.disabled=other.disabled=true; setProg(i+1,qs.length);

const norm=s=>s.toLowerCase().replace(/[«»"'`]/g,"").replace(/\s+/g," ").replace(/[–—]/g,"-").trim();
function gapScreen(q,i,n){ const answers=[]; let k=0;
  const html=esc(q.s).replace(/\[\[(.+?)\]\]/g,(_,a)=>{const alts=a.split("|").map(x=>x.trim());answers.push(alts);const w=Math.min(280,Math.max(96,alts[0].length*13+34));return `<input class="inp" id="g${k++}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${w}px">`});
  return {answers,html:`<div class="round">${rtop(Math.round(i/n*100))}<div class="body"><span class="tag">${esc(q.t[lang].topic)}</span><p class="cloze">${html}</p></div><div class="act"><button class="btn blue full big" id="chk">${L().check} ${kbd("Enter",1)}</button></div><div id="sheetSlot"></div></div>`}; }
function runGap(qs,onDone,acc){
  let i=0; acc=acc||{correct:0,total:0,xp:0};
  const step=()=>{ if(i>=qs.length) return onDone(acc);
    const q=qs[i]; const {answers,html}=gapScreen(q,i,qs.length); app.innerHTML=html; wireQuit(); setCombo(combo); $("#g0").focus();
    const check=()=>{ if($("#sheet")) return; let all=true; const misses=[];
      answers.forEach((alts,j)=>{const el=$("#g"+j); const v=norm(el.value); const ok=alts.some(a=>norm(a)===v)||(v.length>3&&alts.some(a=>norm(a).startsWith(v)&&v.length>=norm(a).length-1)); el.classList.add(ok?"ok":"bad"); el.disabled=true; acc.total++; if(ok){acc.correct++;acc.xp+=2}else{all=false;misses.push([el.value,alts[0]]); el.value=alts[0]}});

      const okN=answers.length-misses.length;
      $("#sheetSlot").innerHTML=sheet({ok:all,title:all?L().resok:L().resbad,sub:answers.length>1?`${okN} ${L().of} ${answers.length}`:"",text,q,btn:all?"green":"red",btnLabel:L().next});
      wireSheet(q,q.s.replace(/\[\[(.+?)\]\]/g,(_,a)=>a.split("|")[0]),()=>{i++;step()}); if(!all) $("#more").click(); };
    $("#chk").onclick=check; document.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}else if(e.key==="Escape")location.hash="home"};

function playGap(id){ combo=0; const t=ticketFor(id); const qs=shuffle((window.DRILLS[t.n]?.cloze?.[lang]||[]).map(s=>({s,t}))).slice(0,3); if(!qs.length) return home(); runGap(qs,acc=>finish(id,"gap",acc.correct,acc.total,acc.xp)); }

// ---------- order the steps ----------
function playOrder(id){
  const t=ticketFor(id); const st=window.DRILLS[t.n]?.steps?.[lang]; if(!st) return home(); combo=0;
  let cur=shuffle(st.items.map((s,i)=>i)); if(cur.every((v,i)=>v===i)) cur.reverse(); let sel=null, tries=0;
  const render=(result)=>{
    app.innerHTML=`<div class="round">${rtop(result&&result.ok?100:0,result&&result.ok)}<div class="body"><span class="tag">${esc(t[lang].topic)}</span><p class="q">${esc(st.title)}</p>
      <div class="steps">${cur.map((idx,pos)=>`<div class="step${sel===pos?" sel":""}${result?(idx===pos?" ok":" bad"):""}" data-pos="${pos}" draggable="${!result}"><span class="n">${pos+1}</span><span class="sx">${codify(st.items[idx])}</span><span class="mv"><button data-up="${pos}" aria-label="up">${I.up}</button><button data-dn="${pos}" aria-label="down">${I.down}</button></span></div>`).join("")}</div></div>
      ${result?"":`<div class="act"><button class="btn blue full big" id="chk">${L().check} ${kbd("Enter",1)}</button><div class="hint"><span>${kbd("↑")}${kbd("↓")} ${L().hintMove}</span><span>${kbd("Enter")} ${L().hintCheck}</span></div></div>`}<div id="sheetSlot"></div></div>`;
    wireQuit();
    const move=(a,b)=>{if(b<0||b>=cur.length)return;const v=cur.splice(a,1)[0];cur.splice(b,0,v);sel=b;render()};
    app.querySelectorAll("[data-up]").forEach(b=>b.onclick=e=>{e.stopPropagation();move(+b.dataset.up,+b.dataset.up-1)});
    app.querySelectorAll("[data-dn]").forEach(b=>b.onclick=e=>{e.stopPropagation();move(+b.dataset.dn,+b.dataset.dn+1)});
    app.querySelectorAll(".step").forEach(li=>{const pos=+li.dataset.pos;
      li.onclick=()=>{if(result)return; if(sel===null){sel=pos;render()}else if(sel===pos){sel=null;render()}else move(sel,pos)};
      li.ondragstart=e=>{e.dataTransfer.setData("text",pos)}; li.ondragover=e=>e.preventDefault(); li.ondrop=e=>{e.preventDefault();move(+e.dataTransfer.getData("text"),pos)};});
    const check=()=>{tries++;const n=cur.filter((v,i)=>v===i).length;const ok=n===cur.length;beep(ok);setCombo(ok?combo+1:0);render({ok,n});
      const wrong=cur.map((v,i)=>v!==i?i+1:null).filter(Boolean);
      $("#sheetSlot").innerHTML=sheet({ok,title:ok?L().resok:L().resbad,sub:`${n} ${L().of} ${cur.length} ${L().inplace}`,text:ok?"":`${L().swapped}: ${wrong.join(", ")}`,q:{t,ok:true},btn:ok?"green":"red",btnLabel:ok?L().next:L().tryagain});
      wireSheet({t,ok:true},st.title,ok?()=>finish(id,"order",1,1,tries===1?5:2):()=>render(),bestPara(t,st.title));};
    if($("#chk")) $("#chk").onclick=check;
    if(!result) document.onkeydown=e=>{if(e.key==="Enter")check();else if(e.key==="ArrowUp"&&sel!==null){e.preventDefault();move(sel,sel-1)}else if(e.key==="ArrowDown"&&sel!==null){e.preventDefault();move(sel,sel+1)}else if(e.key==="Escape")location.hash="home"};
  }; render();
}

        rec.onend=()=>{if(recording&&rec){try{rec.start()}catch{}}}; try{rec.start()}catch{}} };

    $("#ask").onclick=()=>speak(d.qs[qi]); $("#rec").onclick=startRec; $("#stp").onclick=stopRec;
    $("#nxq").onclick=()=>{ stopAll(); if(qi<2){qi++;render()} else reveal(); };
    document.onkeydown=e=>{if(e.key===" "&&!e.target.closest("input")){e.preventDefault();recording?stopRec():startRec()}else if(e.key==="Enter"){$("#nxq").click()}else if(e.key==="Escape"){stopAll();location.hash="home"}};
  };
  const reveal=()=>{ try{speechSynthesis.cancel()}catch{}
    const ids=t.core.filter(c=>byId(c)&&byId(c).st!=="parked"); if(!ids.length) ids.push(id);
    app.innerHTML=`<div class="round" style="min-height:0">${rtop(100,true)}<h2 class="h2" style="margin-top:28px">${L().reveal}</h2>
      ${d.qs.map((q,k)=>`<div class="rev" style="margin-top:28px"><span class="qn">${k+1} / 3</span><p class="q">${codify(q)}</p>${transcripts[k]?`<div class="tr" style="min-height:0;padding:12px 14px"><span class="lab">${L().said}</span>${esc(transcripts[k])}</div>`:""}<div class="ref" style="border-top:0;padding-top:4px"><span class="rq">${L().reference}</span><p>${codify(d.a[k].t)}</p></div><div class="kill"><b>${L().killh}:</b> ${d.kill}</div></div>${k<2?`<div class="rule" style="margin-top:28px"></div>`:""}`).join("")}
      <div class="card" style="margin-top:28px;padding:20px;display:flex;flex-direction:column;gap:14px;border-color:#3d4f5a"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:18px;font-weight:900">${L().selfscore}</span><span class="sub">${L().selfsub.replace("#ID",ids.map(x=>"#"+x).join(", "))}</span></div>
      <div class="score"><button class="g" data-s="green"><span class="k">✓</span>${L().g}</button><button class="y" data-s="yellow"><span class="k">~</span>${L().y}</button><button class="r" data-s="red"><span class="k">✗</span>${L().r}</button></div>
      <div class="hint" style="justify-content:flex-start"><span>${kbd("1")} ${L().cold}</span><span>${kbd("2")} ${L().shaky}</span><span>${kbd("3")} ${L().missed}</span></div></div><div style="height:40px"></div></div>`;
    wireQuit();
    const scoreIt=async st=>{ const xp={green:10,yellow:6,red:3}[st]; beep(st!=="red"); const was=streak(), xpWas=xpToday();
      for(const cid of ids) await post("/api/done",{id:cid,st,mode:"voice",xp:cid===ids[0]?xp:0,transcript:transcripts.join(" | ").slice(0,600)});
      lastChanged=ids[0];
      app.innerHTML=`<div class="round">${rtop(100,true)}<div class="res"><span class="tag">${ids.map(x=>"#"+x).join(", ")} → ${L().statuses[st]}</span><div class="n" style="margin-top:24px;color:${{green:"var(--good)",yellow:"var(--warn)",red:"var(--crit)"}[st]}">${{green:"✓",yellow:"~",red:"✗"}[st]}</div><div class="v">${{green:L().g,yellow:L().y,red:L().r}[st]}</div><div class="xp">+${xp} XP</div><div class="mom">${momTiles(was,xpWas)}</div></div>
        <div class="act" style="flex-direction:row;gap:12px;margin-top:36px"><button class="btn green full big" id="hm">${L().home} ${kbd("Enter",1)}</button></div></div>`;
      wireQuit(); $("#hm").onclick=()=>location.hash="home"; document.onkeydown=e=>{if(e.key==="Enter"||e.key==="Escape")location.hash="home"}; };
    app.querySelectorAll(".score button").forEach(b=>b.onclick=()=>scoreIt(b.dataset.s));
    document.onkeydown=e=>{if(e.key==="1")scoreIt("green");else if(e.key==="2")scoreIt("yellow");else if(e.key==="3")scoreIt("red");else if(e.key==="Escape")location.hash="home"};
  };
  render();
}

// ---------- quick round ----------
function quick(){
  const d=due().slice(0,3).map(i=>i.id); const nn=nextNew(); const ids=d.length?d:(nn?[nn.id]:[17]); combo=0;
  const qs=buildTF(ids,8);
  runTF(qs,acc=>{ const ts=ids.map(ticketFor).filter(Boolean); const gq=shuffle(ts.flatMap(t=>(window.DRILLS[t.n]?.cloze?.[lang]||[]).map(s=>({s,t})))).slice(0,5);
    runGap(gq,g=>finish(ids[0],"quick",acc.correct+g.correct,qs.length+g.total,acc.xp+g.xp,ids)); },L().quick);
}

// ---------- router ----------
function route(){
  document.onkeydown=null; try{speechSynthesis.cancel()}catch{} window.scrollTo(0,0);
  if(needLogin) return loginScreen();
  const h=location.hash.slice(1)||"home"; const [scr,a,b]=h.split("/");
  if(scr==="play"){const id=+a; if(!byId(id)) return home(); ({tf:playTF,gap:playGap,order:playOrder,voice:playVoice}[b]||home)(id); return;}
  if(scr==="quick") return quick();
  if(scr==="item") return itemScreen(+a);
  home();
}
window.addEventListener("hashchange",()=>route());
loadState().then(async()=>{await flushPending(); route();});
</script>
